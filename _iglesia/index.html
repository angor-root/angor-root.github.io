<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de iglesia · demo</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Demostración con datos ficticios: asistencia, Mi espacio y consejería.">
  <style>
    :root {
      color-scheme: light;
      --fondo: #f5f4f0;
      --superficie: #ffffff;
      --superficie-2: #efeee9;
      --borde: #dcdad3;
      --texto: #1b1b19;
      --texto-2: #55534e;
      --texto-3: #807d76;
      --acento: #2a5bd7;
      --acento-texto: #ffffff;
      --acento-suave: #e7edfb;
      --ok: #137a3a;
      --ok-suave: #e3f3e8;
      --alerta: #a4410e;
      --alerta-suave: #fbeee4;
      --serie-1: #2a78d6;
      --grilla: #e6e4de;
      --radio: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --fondo: #121211;
        --superficie: #1c1c1a;
        --superficie-2: #262624;
        --borde: #3a3936;
        --texto: #f0efec;
        --texto-2: #c3c2b7;
        --texto-3: #959389;
        --acento: #6f97f2;
        --acento-texto: #0b1022;
        --acento-suave: #1e2a47;
        --ok: #4cc27a;
        --ok-suave: #16301f;
        --alerta: #f08a52;
        --alerta-suave: #3a2216;
        --serie-1: #3987e5;
        --grilla: #2e2d2a;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --fondo: #121211; --superficie: #1c1c1a; --superficie-2: #262624; --borde: #3a3936;
      --texto: #f0efec; --texto-2: #c3c2b7; --texto-3: #959389;
      --acento: #6f97f2; --acento-texto: #0b1022; --acento-suave: #1e2a47;
      --ok: #4cc27a; --ok-suave: #16301f; --alerta: #f08a52; --alerta-suave: #3a2216;
      --serie-1: #3987e5; --grilla: #2e2d2a;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--fondo); color: var(--texto);
      font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .contenedor { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    .contenedor.ancho { max-width: 960px; }
    header.cabecera { text-align: center; padding: 8px 0 16px; }
    .iglesia { font-size: 15px; color: var(--texto-2); letter-spacing: .02em; }
    .programa { font-size: 22px; font-weight: 700; margin-top: 2px; }

    .tarjeta {
      background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
      padding: 20px; margin-bottom: 16px;
    }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 12px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .suave { color: var(--texto-2); }
    .pequeno { font-size: 15px; }
    .centro { text-align: center; }

    label.campo { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type=text], input[type=tel], input[type=search], input[type=password], input[type=date], input[type=time], select {
      width: 100%; font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 12px;
      border: 2px solid var(--borde); background: var(--superficie); color: var(--texto);
    }
    input:focus, select:focus, button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

    button { font: inherit; cursor: pointer; }
    .boton {
      display: block; width: 100%; min-height: 60px; padding: 14px 18px; margin-top: 12px;
      border-radius: 14px; border: 0; background: var(--acento); color: var(--acento-texto);
      font-size: 21px; font-weight: 700;
    }
    .boton[disabled] { opacity: .5; cursor: default; }
    .boton.secundario { background: var(--superficie-2); color: var(--texto); }
    .enlace {
      display: block; width: 100%; background: none; border: 0; color: var(--acento);
      text-decoration: underline; padding: 14px 8px; font-size: 17px;
    }

    .resultados { list-style: none; margin: 8px 0 0; padding: 0; }
    .resultados li + li { margin-top: 8px; }
    .opcion {
      width: 100%; text-align: left; padding: 16px; border-radius: 12px; font-size: 20px;
      border: 2px solid var(--borde); background: var(--superficie); color: var(--texto);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .opcion:hover { border-color: var(--acento); }
    .opcion small { color: var(--texto-3); font-size: 15px; }
    .etiqueta-ok { color: var(--ok); font-size: 15px; font-weight: 600; white-space: nowrap; }

    .casillas { list-style: none; padding: 0; margin: 0; }
    .casillas li + li { margin-top: 8px; }
    .casilla {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px;
      border: 2px solid var(--borde); font-size: 20px; cursor: pointer;
    }
    .casilla input { width: 28px; height: 28px; accent-color: var(--acento); flex: none; }
    .casilla.marcada { border-color: var(--acento); background: var(--acento-suave); }
    .casilla.bloqueada { opacity: .65; cursor: default; }

    .exito-icono {
      width: 96px; height: 96px; border-radius: 50%; margin: 8px auto 16px;
      background: var(--ok-suave); color: var(--ok); display: grid; place-items: center;
    }
    .aviso { padding: 14px 16px; border-radius: 12px; background: var(--ok-suave); color: var(--ok); font-weight: 600; }
    .aviso.alerta { background: var(--alerta-suave); color: var(--alerta); }
    .lista-simple { padding-left: 20px; margin: 0 0 12px; }

    footer.pie { text-align: center; margin-top: 8px; }
    footer.pie button { width: auto; display: inline-block; font-size: 15px; color: var(--texto-3); }

    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
      background: var(--texto); color: var(--fondo); padding: 12px 18px; border-radius: 12px;
      font-size: 16px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #toast.visible { opacity: 1; }

    .cargando { text-align: center; padding: 48px 0; color: var(--texto-2); }
    .giro {
      width: 36px; height: 36px; margin: 0 auto 12px; border-radius: 50%;
      border: 4px solid var(--borde); border-top-color: var(--acento); animation: girar 1s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* Modo ayudante */
    .pestanas { display: flex; gap: 8px; margin-bottom: 16px; }
    .pestanas button {
      flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--borde);
      background: var(--superficie); color: var(--texto); font-weight: 600;
    }
    .pestanas button.activa { border-color: var(--acento); background: var(--acento-suave); }
    .fila-controles { display: flex; gap: 8px; flex-wrap: wrap; }
    .fila-controles > * { flex: 1 1 180px; }
    .contador { font-size: 20px; margin: 14px 0 10px; }
    .contador b { font-size: 30px; }
    .chips { display: flex; gap: 8px; margin: 10px 0; }
    .chips button {
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--borde);
      background: var(--superficie); color: var(--texto-2); font-size: 16px;
    }
    .chips button.activa { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
    .persona {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-radius: 12px; border: 2px solid var(--borde);
      background: var(--superficie); color: var(--texto); text-align: left; font-size: 19px;
    }
    .persona.presente { border-color: var(--ok); background: var(--ok-suave); }
    .persona .marca {
      flex: none; min-width: 108px; text-align: center; padding: 8px 10px; border-radius: 10px;
      background: var(--superficie-2); font-size: 15px; font-weight: 700; color: var(--texto-2);
    }
    .persona.presente .marca { background: var(--ok); color: var(--superficie); }
    .persona small { display: block; color: var(--texto-3); font-size: 14px; }

    /* Panel */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; }
    .kpi .valor { font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi .nombre { font-size: 14px; color: var(--texto-2); margin-top: 4px; }
    .grafico { position: relative; }
    .grafico svg { width: 100%; height: auto; display: block; }
    .grafico text { fill: var(--texto-3); font-size: 12px; }
    .tooltip {
      position: absolute; pointer-events: none; background: var(--texto); color: var(--fondo);
      padding: 6px 10px; border-radius: 8px; font-size: 14px; white-space: nowrap;
      transform: translate(-50%, -110%); display: none;
    }
    .tabla-envoltura { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--grilla); }
    th { font-size: 14px; color: var(--texto-2); font-weight: 600; white-space: nowrap; }
    th button { background: none; border: 0; color: inherit; font-weight: 600; padding: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .barra-pct { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: var(--grilla); vertical-align: middle; margin-left: 8px; overflow: hidden; }
    .barra-pct span { display: block; height: 100%; background: var(--serie-1); border-radius: 4px; }
    .pastilla { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--alerta-suave); color: var(--alerta); }
    .qr-caja { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .qr-caja #qr { background: #fff; padding: 12px; border-radius: 12px; }
    .url { word-break: break-all; font-size: 14px; color: var(--texto-2); }


    /* ───── v2: navegación, Mi espacio, consejería ───── */
    body.con-nav { padding-bottom: 84px; }
    nav.barra-nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px;
      background: var(--superficie); border-top: 1px solid var(--borde); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    nav.barra-nav[hidden] { display: none; }
    nav.barra-nav button {
      flex: 0 1 160px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: 0; border-radius: 12px; padding: 8px 4px; color: var(--texto-2); font-size: 14px; font-weight: 600;
    }
    nav.barra-nav button.activa { color: var(--acento); background: var(--acento-suave); }
    .fila { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .grilla-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .grilla-2 { grid-template-columns: 1fr; } }
    .grande { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .puntos { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; padding: 0; list-style: none; }
    .puntos li {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
      background: var(--superficie-2); color: var(--texto-3); border: 2px solid var(--borde);
    }
    .puntos li.si { background: var(--ok); color: var(--superficie); border-color: var(--ok); }
    .leyenda { display: flex; gap: 16px; font-size: 14px; color: var(--texto-2); }
    .leyenda span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--superficie-2); border: 2px solid var(--borde); }
    .leyenda span.si::before { background: var(--ok); border-color: var(--ok); }
    .cita { border: 2px solid var(--borde); border-radius: 12px; padding: 14px 16px; }
    .cita + .cita { margin-top: 10px; }
    .cita .cuando { font-weight: 700; font-size: 19px; }
    .cita .detalle { color: var(--texto-2); font-size: 16px; margin-top: 2px; }
    .cita .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .boton-chico {
      display: inline-block; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--borde);
      background: var(--superficie); color: var(--texto); font-size: 15px; font-weight: 600; text-decoration: none;
    }
    .boton-chico.primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
    .boton-chico.peligro { color: var(--alerta); }
    .estado { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--superficie-2); color: var(--texto-2); }
    .estado.agendada { background: var(--acento-suave); color: var(--acento); }
    .estado.realizada { background: var(--ok-suave); color: var(--ok); }
    .estado.cancelada, .estado.no_asistio { background: var(--alerta-suave); color: var(--alerta); }
    .seleccion { display: flex; gap: 8px; flex-wrap: wrap; }
    .seleccion button {
      padding: 12px 16px; border-radius: 12px; border: 2px solid var(--borde); background: var(--superficie);
      color: var(--texto); font-size: 17px; font-weight: 600; min-width: 64px;
    }
    .seleccion button.activa { border-color: var(--acento); background: var(--acento-suave); color: var(--acento); }
    .seleccion.fechas button { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
    .seleccion.fechas small { font-size: 12px; font-weight: 500; color: var(--texto-3); text-transform: capitalize; }
    textarea {
      width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; min-height: 96px;
      border: 2px solid var(--borde); background: var(--superficie); color: var(--texto); resize: vertical;
    }
    .paso { font-size: 14px; color: var(--texto-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .dato { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grilla); }
    .dato span:first-child { color: var(--texto-2); }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px;
      background: var(--acento-suave); color: var(--acento); font-size: 26px; font-weight: 700;
    }
    tr.clic { cursor: pointer; }
    tr.clic:hover td { background: var(--superficie-2); }

    #cartel { display: none; }
    @media print {
      body { background: #fff; color: #000; }
      #app, footer, #toast, nav.barra-nav { display: none !important; }
      #cartel { display: block; text-align: center; padding: 40px 20px; font-family: system-ui, sans-serif; }
      #cartel h1 { font-size: 44px; margin: 12px 0; }
      #cartel p { font-size: 22px; }
      #cartel #qrCartel { display: inline-block; margin: 24px auto; }
    }
  </style>

</head>
<body>
  <!--
    Página única del sistema. Cada módulo vive en su propio archivo (js_*.html) y se registra
    en el núcleo (js_nucleo.html). En Apps Script los archivos se insertan con incluir();
    para alojarla en otro sitio: node herramientas/empaquetar.js → dist/index.html
  -->
  <div id="app" class="contenedor">
    <div class="cargando"><div class="giro"></div>Cargando…</div>
  </div>
  <nav id="nav" class="barra-nav" hidden></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="cartel"></div>

  <script>
/*
 * DEMO: ejecuta el backend real (los .gs) dentro del navegador, con una hoja de cálculo
 * simulada guardada en localStorage y datos ficticios. Solo para mostrar cómo funciona.
 */
(function () {
  var CLAVE = 'iglesia-demo.hojas.v1';

  // ───────── Simulador mínimo de servicios de Apps Script ─────────
  function formatDate(fecha, tz, patron) {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short', hourCycle: 'h23' })
      .formatToParts(fecha).forEach(function (x) { p[x.type] = x.value; });
    var u = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[p.weekday];
    return patron.replace(/yyyy|MM|dd|HH|mm|ss|u/g, function (t) {
      return { yyyy: p.year, MM: p.month, dd: p.day, HH: p.hour, mm: p.minute, ss: p.second, u: String(u) }[t];
    });
  }
  function parseDate(texto, tz) {
    var partes = texto.split(' ');
    var guess = new Date(partes[0] + 'T' + partes[1] + ':00Z');
    var local = formatDate(guess, tz, 'yyyy-MM-dd HH:mm');
    return new Date(guess.getTime() - (new Date(local.replace(' ', 'T') + ':00Z') - guess));
  }

  function Rango(h, f, c, nf, nc) { this.h = h; this.f = f; this.c = c; this.nf = nf; this.nc = nc; }
  Rango.prototype.getValues = function () {
    var out = [];
    for (var i = 0; i < this.nf; i++) {
      var fila = this.h.datos[this.f - 1 + i] || [], r = [];
      for (var j = 0; j < this.nc; j++) { var v = fila[this.c - 1 + j]; r.push(v === undefined || v === null ? '' : v); }
      out.push(r);
    }
    return out;
  };
  Rango.prototype.getDisplayValues = function () {
    return this.getValues().map(function (f) {
      return f.map(function (v) { return v instanceof Date ? formatDate(v, 'America/Lima', 'yyyy-MM-dd HH:mm') : String(v); });
    });
  };
  Rango.prototype.setValues = function (vals) {
    var self = this;
    vals.forEach(function (f, i) {
      f.forEach(function (v, j) {
        var r = self.f - 1 + i;
        while (self.h.datos.length <= r) self.h.datos.push([]);
        self.h.datos[r][self.c - 1 + j] = v;
      });
    });
    return this;
  };
  Rango.prototype.setValue = function (v) { return this.setValues([[v]]); };
  Rango.prototype.setFontWeight = function () { return this; };
  Rango.prototype.setNumberFormat = function () { return this; };

  function Hoja(nombre, datos) { this.nombre = nombre; this.datos = datos || []; }
  Hoja.prototype.getLastRow = function () {
    for (var i = this.datos.length; i > 0; i--) {
      if ((this.datos[i - 1] || []).some(function (v) { return v !== '' && v !== undefined && v !== null; })) return i;
    }
    return 0;
  };
  Hoja.prototype.getDataRange = function () {
    var ancho = Math.max.apply(null, [1].concat(this.datos.map(function (f) { return f.length; })));
    return new Rango(this, 1, 1, Math.max(1, this.getLastRow()), ancho);
  };
  Hoja.prototype.getRange = function (a, b, c, d) {
    return typeof a === 'string' ? new Rango(this, 1, 1, 1, 1) : new Rango(this, a, b, c || 1, d || 1);
  };
  Hoja.prototype.appendRow = function (f) { this.datos.splice(this.getLastRow(), 0, f.slice()); };
  Hoja.prototype.deleteRow = function (n) { this.datos.splice(n - 1, 1); };
  Hoja.prototype.setFrozenRows = function () {};

  var hojas = {};
  try {
    var guardado = JSON.parse(localStorage.getItem(CLAVE) || 'null', function (k, v) {
      return v && v.__fecha ? new Date(v.__fecha) : v;
    });
    if (guardado) Object.keys(guardado).forEach(function (n) { hojas[n] = new Hoja(n, guardado[n]); });
  } catch (e) { hojas = {}; }

  function persistir() {
    var o = {};
    Object.keys(hojas).forEach(function (n) { o[n] = hojas[n].datos; });
    try {
      localStorage.setItem(CLAVE, JSON.stringify(o, function (k, v) {
        return this[k] instanceof Date ? { __fecha: this[k].toISOString() } : v;
      }));
    } catch (e) { /* sin almacenamiento: la demo funciona igual mientras la página esté abierta */ }
  }

  var libro = {
    getSheetByName: function (n) { return hojas[n] || null; },
    insertSheet: function (n) { hojas[n] = new Hoja(n); return hojas[n]; },
    getUrl: function () { return ''; }
  };
  var cache = {};
  var servicios = {
    SpreadsheetApp: { getActiveSpreadsheet: function () { return libro; } },
    Utilities: { formatDate: formatDate, parseDate: parseDate },
    Session: { getScriptTimeZone: function () { return 'America/Lima'; } },
    LockService: { getScriptLock: function () { return { tryLock: function () { return true; }, releaseLock: function () {} }; } },
    CacheService: { getScriptCache: function () { return { get: function (k) { return k in cache ? cache[k] : null; }, put: function (k, v) { cache[k] = v; } }; } },
    ScriptApp: { getService: function () { return { getUrl: function () { return location.origin + location.pathname; } }; } },
    MailApp: { sendEmail: function (para, asunto) { console.info('[demo] correo a', para, '—', asunto); } },
    CalendarApp: { getCalendarById: function () { throw new Error('Sin calendario en la demo'); } }
  };

  // ───────── El backend real, aislado en su propio ámbito ─────────
  var Backend = (function (SpreadsheetApp, Utilities, Session, LockService, CacheService, ScriptApp, MailApp, CalendarApp) {
    // ── 00_Nucleo.gs ──
/**
 * NÚCLEO del sistema (Google Apps Script + Google Sheets).
 *
 * La persona es el centro: todo módulo (asistencia, consejería, …) guarda filas
 * que apuntan a un persona_id de la hoja Personas.
 *
 * Un módulo es un objeto con esta forma (ver 20_Asistencia.gs como ejemplo):
 *   {
 *     id: 'asistencia', nombre: 'Asistencia',
 *     hojas:   { NombreHoja: ['col1', 'col2', …] },     // se crean con "Preparar hojas"
 *     config:  [['CLAVE', 'valor', 'descripción'], …],   // filas por defecto de Config
 *     acciones: { nombre: { requiere: 'persona'|'ayudante'|'consejero'|'admin'|null, fn: f(datos, sesion) } },
 *     perfil:  f(persona, ctx) → datos para "Mi espacio" de esa persona   (opcional)
 *     ficha:   f(persona, ctx) → datos para la ficha que ve el administrador (opcional)
 *     preparar: f() → ajustes extra al preparar las hojas                   (opcional)
 *   }
 * La página llama api('modulo.accion', datos). Para agregar un módulo: crea su
 * archivo .gs y súmalo a todosLosModulos(). Para apagarlo: Config → MODULOS_ACTIVOS.
 */

function todosLosModulos() {
  return [MODULO_PERSONAS, MODULO_ASISTENCIA, MODULO_CONSEJERIA];
}

function modulosActivos() {
  var lista = String(leerConfig().MODULOS_ACTIVOS || '').split(',')
    .map(function (s) { return normalizar(s); }).filter(Boolean);
  return todosLosModulos().filter(function (m) {
    return m.nucleo || !lista.length || lista.indexOf(m.id) >= 0;
  });
}

function moduloActivo(id) {
  return modulosActivos().some(function (m) { return m.id === id; });
}

// ───────────────────────── Entradas web ─────────────────────────

function doGet() {
  return HtmlService.createTemplateFromFile('App').evaluate()
    .setTitle('Mi Iglesia')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

/** Inserta otro archivo HTML del proyecto (estilos y módulos de la página). */
function incluir(nombre) {
  return HtmlService.createHtmlOutputFromFile(nombre).getContent();
}

/** API JSON para cuando la página está alojada fuera de Apps Script. */
function doPost(e) {
  var cuerpo = {};
  try { cuerpo = JSON.parse(e.postData.contents); } catch (err) { /* cuerpo vacío */ }
  return ContentService.createTextOutput(JSON.stringify(api(cuerpo.accion, cuerpo.datos)))
    .setMimeType(ContentService.MimeType.JSON);
}

var _memo = {}; // lecturas de hojas durante una misma petición

function api(accion, datos) {
  _memo = {};
  datos = datos || {};
  try {
    var partes = String(accion || '').split('.');
    var modulo = modulosActivos().filter(function (m) { return m.id === partes[0]; })[0];
    var def = modulo && Object.prototype.hasOwnProperty.call(modulo.acciones, partes[1])
      ? modulo.acciones[partes[1]] : null;
    if (!def) return { ok: false, error: 'Acción desconocida' };
    var ses = sesion(datos, def.requiere);
    var r = def.fn(datos, ses) || {};
    r.ok = true;
    r.app = infoApp();
    return r;
  } catch (err) {
    if (err && err.usuario) return { ok: false, error: err.message, codigoError: err.codigo || '' };
    console.error(err && err.stack ? err.stack : err);
    return { ok: false, error: 'Ocurrió un error. Intenta de nuevo en un momento.' };
  }
}

function infoApp() {
  return {
    iglesia: leerConfig().NOMBRE_IGLESIA,
    modulos: modulosActivos().map(function (m) { return m.id; })
  };
}

/** Error que se muestra tal cual al usuario. */
function fallo(mensaje, codigo) {
  var e = new Error(mensaje);
  e.usuario = true;
  e.codigo = codigo || '';
  throw e;
}

// ───────────────────────── Sesión y permisos ─────────────────────────

/**
 * Credenciales posibles en datos:
 *   pin    → PIN compartido de la puerta (ayudante) o del administrador
 *   codigo → código personal de cada persona (su "llave" para Mi espacio)
 * Roles: persona, ayudante, consejero, admin (columna "roles" de Personas).
 */
function sesion(datos, requiere) {
  var s = { persona: null, roles: [] };
  var config = leerConfig();
  var tieneCredencial = !!(datos.pin || datos.codigo);
  if (tieneCredencial && bloqueadoPorIntentos()) fallo('Demasiados intentos. Espera 10 minutos.', 'bloqueado');

  var pin = String(datos.pin || '').trim();
  if (pin && config.PIN_ADMIN && pin === config.PIN_ADMIN) s.roles = ['admin', 'ayudante'];
  else if (pin && config.PIN_AYUDANTE && pin === config.PIN_AYUDANTE) s.roles = ['ayudante'];

  if (datos.codigo) {
    var p = personaPorCodigo(datos.codigo);
    if (p) {
      s.persona = p;
      s.roles = unicos(s.roles.concat(['persona'], p.roles));
      if (s.roles.indexOf('admin') >= 0 && s.roles.indexOf('ayudante') < 0) s.roles.push('ayudante');
    }
  }
  var credencialMala = (pin && !s.roles.length) || (datos.codigo && !s.persona);
  if (credencialMala) registrarFalloCredencial();

  if (requiere && s.roles.indexOf(requiere) < 0) {
    var mensajes = {
      persona: 'Tu código personal no es válido. Pídele a un líder tu enlace personal.',
      ayudante: 'PIN incorrecto.',
      consejero: 'Esta sección es solo para consejeros.',
      admin: 'Necesitas permisos de administrador.'
    };
    fallo(mensajes[requiere] || 'No tienes permiso.', 'permiso');
  }
  return s;
}

function tieneRol(ses, rol) { return ses.roles.indexOf(rol) >= 0; }

function bloqueadoPorIntentos() {
  return Number(CacheService.getScriptCache().get('fallos_credencial') || 0) >= 20;
}

function registrarFalloCredencial() {
  var cache = CacheService.getScriptCache();
  var n = Number(cache.get('fallos_credencial') || 0) + 1;
  cache.put('fallos_credencial', String(n), 600);
  if (n >= 20) fallo('Demasiados intentos. Espera 10 minutos.', 'bloqueado');
}

// ───────────────────────── Configuración ─────────────────────────

function configPorDefecto() {
  var filas = [];
  todosLosModulos().forEach(function (m) { filas = filas.concat(m.config || []); });
  return filas;
}

function leerConfig() {
  if (_memo.config) return _memo.config;
  var c = {};
  configPorDefecto().forEach(function (d) { c[d[0]] = d[1]; });
  var h = libro().getSheetByName(HOJA_CONFIG);
  if (h) {
    leerTabla(HOJA_CONFIG).forEach(function (f) {
      if (f.clave) c[String(f.clave).trim()] = String(f.valor === undefined ? '' : f.valor).trim();
    });
  }
  _memo.config = c;
  return c;
}

var HOJA_CONFIG = 'Config';

function zonaHoraria() { return leerConfig().ZONA_HORARIA || Session.getScriptTimeZone(); }

// ───────────────────────── Acceso a hojas ─────────────────────────

function libro() { return SpreadsheetApp.getActiveSpreadsheet(); }

function hoja(nombre) {
  var h = libro().getSheetByName(nombre);
  if (!h) fallo('Falta la hoja "' + nombre + '". Usa el menú Sistema → Preparar hojas.');
  return h;
}

/** Filas de una hoja como objetos {encabezado: valor, _fila: n}. Se leen una vez por petición. */
function leerTabla(nombre, mostrar) {
  var clave = 'tabla:' + nombre + (mostrar ? ':mostrar' : '');
  if (_memo[clave]) return _memo[clave];
  var rango = hoja(nombre).getDataRange();
  var valores = mostrar ? rango.getDisplayValues() : rango.getValues();
  var enc = valores[0].map(function (e) { return String(e).trim(); });
  var filas = valores.slice(1).map(function (fila, i) {
    var o = { _fila: i + 2 };
    enc.forEach(function (e, j) { if (e) o[e] = fila[j]; });
    return o;
  });
  _memo[clave] = filas;
  return filas;
}

function encabezados(nombre) {
  var h = hoja(nombre);
  return h.getDataRange().getValues()[0].map(function (e) { return String(e).trim(); });
}

function olvidarTabla(nombre) {
  delete _memo['tabla:' + nombre];
  delete _memo['tabla:' + nombre + ':mostrar'];
}

/** Agrega filas a partir de objetos; cada propiedad va a la columna con ese encabezado. */
function agregarFilas(nombre, objetos) {
  if (!objetos.length) return;
  var h = hoja(nombre);
  var enc = encabezados(nombre);
  var filas = objetos.map(function (o) {
    return enc.map(function (e) { return o[e] === undefined || o[e] === null ? '' : o[e]; });
  });
  h.getRange(h.getLastRow() + 1, 1, filas.length, enc.length).setValues(filas);
  olvidarTabla(nombre);
}

/** Cambia algunas columnas de una fila existente. */
function actualizarFila(nombre, numeroFila, cambios) {
  var h = hoja(nombre);
  var enc = encabezados(nombre);
  Object.keys(cambios).forEach(function (k) {
    var col = enc.indexOf(k);
    if (col >= 0) h.getRange(numeroFila, col + 1).setValue(cambios[k]);
  });
  olvidarTabla(nombre);
}

function borrarFilas(nombre, numeros) {
  var h = hoja(nombre);
  numeros.slice().sort(function (a, b) { return b - a; }).forEach(function (n) { h.deleteRow(n); });
  olvidarTabla(nombre);
}

function conCandado(fn) {
  var candado = LockService.getScriptLock();
  if (!candado.tryLock(15000)) fallo('Hay mucha gente usando el sistema a la vez. Intenta de nuevo.');
  try { _memo = { config: _memo.config }; return fn(); } finally { candado.releaseLock(); }
}

function urlApp() {
  try { return ScriptApp.getService().getUrl() || ''; } catch (e) { return ''; }
}

/** Envía un correo sin interrumpir la operación si falla (cuota, dirección mala…). */
function avisarPorCorreo(para, asunto, cuerpo) {
  if (!para) return false;
  try { MailApp.sendEmail(para, asunto, cuerpo); return true; } catch (e) { console.warn(e); return false; }
}

// ───────────────────────── Fechas y horas ─────────────────────────

var DIAS = { lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6, domingo: 7 };
var NOMBRES_DIA = ['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

function formatear(fecha, tz, patron) { return Utilities.formatDate(fecha, tz, patron); }

function ahoraLocal() {
  var ahora = new Date();
  var tz = zonaHoraria();
  return {
    fecha: ahora, tz: tz,
    hoy: formatear(ahora, tz, 'yyyy-MM-dd'),
    hora: formatear(ahora, tz, 'HH:mm'),
    dia: Number(formatear(ahora, tz, 'u'))
  };
}

/** "15:40", "3:40 PM", "3:40:00 p. m." → minutos desde medianoche. */
function minutos(texto) {
  var m = String(texto || '').match(/(\d{1,2})[:.h](\d{2})(?::\d{2})?\s*([ap])?/i);
  if (!m) return NaN;
  var h = Number(m[1]) % 24;
  if (m[3] && m[3].toLowerCase() === 'p' && h < 12) h += 12;
  if (m[3] && m[3].toLowerCase() === 'a' && h === 12) h = 0;
  return h * 60 + Number(m[2]);
}

function hhmm(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }

function hora12(texto) {
  var t = minutos(texto);
  if (isNaN(t)) return String(texto);
  var h = Math.floor(t / 60), m = t % 60;
  return ((h % 12) || 12) + ':' + pad2(m) + (h < 12 ? ' a. m.' : ' p. m.');
}

function parsearDias(texto) {
  return String(texto || '').split(/[,;\/]+|\s+/).map(function (d) {
    return DIAS[normalizar(d)];
  }).filter(function (d, i, l) { return d && l.indexOf(d) === i; }).sort();
}

function describirDias(dias) {
  var n = dias.map(function (d) { return NOMBRES_DIA[d]; });
  var t = n.length > 1 ? n.slice(0, -1).join(', ') + ' y ' + n[n.length - 1] : n[0] || '';
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
}

/** Día de la semana (1 = lunes … 7 = domingo) de un texto aaaa-mm-dd, sin depender de husos. */
function diaDeSemana(fecha) {
  var p = fecha.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)).getUTCDay();
  return d === 0 ? 7 : d;
}

function sumarDias(fecha, n) {
  var p = fecha.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n, 12));
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

function aFecha(v, tz) {
  if (!v) return '';
  if (v instanceof Date) return formatear(v, tz || zonaHoraria(), 'yyyy-MM-dd');
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // dd/mm/aaaa
  if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  return s;
}

function validarFecha(s) {
  s = String(s || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) fallo('Fecha no válida.');
  return s;
}

// ───────────────────────── Utilidades ─────────────────────────

function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

function normalizar(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

function limpiarNombre(s) {
  return limpiarTexto(s, 60).replace(/(^|\s)(\S)/g, function (m, esp, letra) { return esp + letra.toUpperCase(); });
}

function limpiarTexto(s, max) {
  return String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max || 200);
}

function limpiarCorreo(s) {
  s = String(s || '').trim().toLowerCase().slice(0, 100);
  if (s && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) fallo('El correo no parece válido.');
  return s;
}

function limpiarTelefono(s) { return String(s || '').replace(/[^\d+ ]/g, '').trim().slice(0, 20); }

/** Siguiente id con prefijo: P0001, P0002… / C0001… */
function siguienteId(filas, prefijo) {
  var max = 0, re = new RegExp('^' + prefijo + '(\\d+)$');
  filas.forEach(function (f) {
    var m = String(f.id || '').match(re);
    if (m) max = Math.max(max, Number(m[1]));
  });
  var n = String(max + 1);
  while (n.length < 4) n = '0' + n;
  return prefijo + n;
}

function indexar(lista, campo) {
  var o = {};
  lista.forEach(function (x) { o[x[campo || 'id']] = x; });
  return o;
}

function unicos(lista) {
  return lista.filter(function (x, i) { return x && lista.indexOf(x) === i; });
}

function numero(v, porDefecto) {
  var n = Number(v);
  return v !== '' && isFinite(n) && n >= 0 ? n : porDefecto;
}

function esSi(v) {
  return v === true || /^(si|sí|true|x|1|activo)$/i.test(String(v || '').trim());
}

function aleatorio(alfabeto, largo) {
  var s = '';
  for (var i = 0; i < largo; i++) s += alfabeto.charAt(Math.floor(Math.random() * alfabeto.length));
  return s;
}

// ── 10_Personas.gs ──
/**
 * MÓDULO PERSONAS (núcleo): la lista de personas, su código personal y su perfil.
 *
 * Cada persona tiene un código personal (columna "codigo") que funciona como su llave:
 * el enlace  …/exec?mi=CODIGO  abre "Mi espacio" con su asistencia, sus citas y sus datos.
 * Los líderes lo comparten por WhatsApp desde el panel.
 */

var HOJA_PERSONAS = 'Personas';
var ALFABETO_CODIGO = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sin 0/O, 1/I/L

var MODULO_PERSONAS = {
  id: 'personas',
  nombre: 'Personas',
  nucleo: true,
  hojas: {
    Config: ['clave', 'valor', 'descripcion'],
    Personas: ['id', 'nombres', 'apellidos', 'familia', 'telefono', 'correo', 'programas',
      'roles', 'estado', 'codigo', 'creado', 'notas']
  },
  config: [
    ['NOMBRE_IGLESIA', 'Mi Iglesia', 'Se muestra en la parte superior de la página'],
    ['ZONA_HORARIA', 'America/Lima', 'Zona horaria IANA, p. ej. America/Lima, America/Santiago, America/Bogota'],
    ['PIN_AYUDANTE', '', 'PIN compartido para servidores de la puerta (modo ayudante)'],
    ['PIN_ADMIN', '', 'PIN del panel de administración (también sirve como PIN de ayudante)'],
    ['MODULOS_ACTIVOS', 'asistencia, consejeria', 'Módulos encendidos, separados por coma. Vacío = todos']
  ],
  acciones: {
    info: { fn: function () { return {}; } }, // nombre de la iglesia y módulos activos (los agrega api())
    entrar: { fn: personasEntrar },
    yo: { requiere: 'persona', fn: personasYo },
    misDatos: { requiere: 'persona', fn: personasMisDatos },
    lista: { requiere: 'admin', fn: personasLista },
    ficha: { requiere: 'admin', fn: personasFicha }
  },
  preparar: function () {
    hoja(HOJA_PERSONAS).getRange('A:A').setNumberFormat('@');
    hoja(HOJA_PERSONAS).getRange('E:E').setNumberFormat('@');
    hoja(HOJA_CONFIG).getRange('B:B').setNumberFormat('@');
  }
};

// ───────────────────────── Lectura ─────────────────────────

var ALIAS_ROLES = { maestro: 'consejero', pastor: 'consejero', lider: 'admin', servidor: 'ayudante' };

function leerPersonas() {
  if (_memo.personas) return _memo.personas;
  var tz = zonaHoraria();
  _memo.personas = leerTabla(HOJA_PERSONAS).filter(function (f) { return f.id && f.nombres; }).map(function (f) {
    var nombres = String(f.nombres).trim(), apellidos = String(f.apellidos || '').trim();
    return {
      _fila: f._fila,
      id: String(f.id).trim(), nombres: nombres, apellidos: apellidos,
      nombre: (nombres + ' ' + apellidos).trim(),
      familia: String(f.familia || '').trim(),
      telefono: String(f.telefono || '').trim(),
      correo: String(f.correo || '').trim(),
      programas: listaDeTexto(f.programas),
      roles: unicos(listaDeTexto(f.roles).map(function (r) { r = normalizar(r); return ALIAS_ROLES[r] || r; })),
      estado: normalizar(f.estado) || 'activo',
      codigo: String(f.codigo || '').trim().toUpperCase(),
      creado: aFecha(f.creado, tz)
    };
  });
  return _memo.personas;
}

function listaDeTexto(texto) {
  return String(texto || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
}

function personaPorId(id) {
  return leerPersonas().filter(function (p) { return p.id === String(id); })[0] || null;
}

function personaPorCodigo(codigo) {
  var c = String(codigo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length < 6) return null;
  return leerPersonas().filter(function (p) { return p.codigo === c && p.estado !== 'inactivo'; })[0] || null;
}

/** Lo mínimo que se muestra en listas públicas (buscador de asistencia). */
function personaPublica(p) {
  return { id: p.id, nombre: p.nombre, familia: p.familia || '' };
}

/** Lo que la persona ve de sí misma. */
function personaPropia(p) {
  return {
    id: p.id, nombre: p.nombre, nombres: p.nombres, apellidos: p.apellidos, familia: p.familia,
    telefono: p.telefono, correo: p.correo, roles: p.roles, estado: p.estado
  };
}

function enlacePersonal(p) {
  return p.codigo ? urlApp() + '?mi=' + p.codigo : '';
}

function nuevoCodigo() {
  var usados = leerPersonas().map(function (p) { return p.codigo; });
  var c;
  do { c = aleatorio(ALFABETO_CODIGO, 8); } while (usados.indexOf(c) >= 0);
  return c;
}

/** Crea una persona (estado "nuevo" por defecto) y devuelve el objeto leído. */
function crearPersona(datos) {
  var todas = leerPersonas();
  var id = siguienteId(todas, 'P');
  agregarFilas(HOJA_PERSONAS, [{
    id: id, nombres: datos.nombres, apellidos: datos.apellidos, familia: datos.familia || '',
    telefono: datos.telefono || '', correo: datos.correo || '', programas: datos.programas || '',
    roles: '', estado: datos.estado || 'nuevo', codigo: nuevoCodigo(),
    creado: ahoraLocal().hoy, notas: datos.notas || ''
  }]);
  delete _memo.personas;
  return personaPorId(id);
}

function buscarPorNombre(nombres, apellidos) {
  var clave = normalizar(nombres + ' ' + apellidos);
  return leerPersonas().filter(function (p) { return normalizar(p.nombre) === clave; })[0] || null;
}

// ───────────────────────── Acciones ─────────────────────────

/** Valida un PIN o un código personal y dice qué puede hacer. */
function personasEntrar(datos) {
  var ses = sesion(datos, null);
  if (!ses.roles.length) {
    fallo(datos.codigo ? 'Ese código no existe. Revisa que esté bien escrito.' : 'PIN incorrecto.', 'credencial');
  }
  return { roles: ses.roles, persona: ses.persona ? personaPropia(ses.persona) : null };
}

/** "Mi espacio": cada módulo activo aporta su sección sobre esta persona. */
function personasYo(datos, ses) {
  var ctx = { ahora: ahoraLocal(), ses: ses };
  var secciones = {};
  modulosActivos().forEach(function (m) {
    if (m.perfil) secciones[m.id] = m.perfil(ses.persona, ctx);
  });
  return { persona: personaPropia(ses.persona), roles: ses.roles, secciones: secciones };
}

function personasMisDatos(datos, ses) {
  var cambios = {};
  if ('telefono' in datos) cambios.telefono = limpiarTelefono(datos.telefono);
  if ('correo' in datos) cambios.correo = limpiarCorreo(datos.correo);
  return conCandado(function () {
    actualizarFila(HOJA_PERSONAS, personaPorId(ses.persona.id)._fila, cambios);
    delete _memo.personas;
    return { persona: personaPropia(personaPorId(ses.persona.id)) };
  });
}

/** Lista para el administrador, con el enlace personal de cada uno. */
function personasLista() {
  return {
    personas: leerPersonas().map(function (p) {
      return {
        id: p.id, nombre: p.nombre, familia: p.familia, telefono: p.telefono, correo: p.correo,
        roles: p.roles, estado: p.estado, creado: p.creado, enlace: enlacePersonal(p)
      };
    }).sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); })
  };
}

/** Ficha completa de una persona para el administrador: datos + lo que aporte cada módulo. */
function personasFicha(datos, ses) {
  var p = personaPorId(datos.id);
  if (!p) fallo('Esa persona no existe.');
  var ctx = { ahora: ahoraLocal(), ses: ses };
  var secciones = {};
  modulosActivos().forEach(function (m) {
    if (m.ficha) secciones[m.id] = m.ficha(p, ctx);
  });
  var x = personaPropia(p);
  x.creado = p.creado;
  x.programas = p.programas;
  x.enlace = enlacePersonal(p);
  return { persona: x, secciones: secciones };
}

// ───────────────────────── Mantenimiento (menú de la hoja) ─────────────────────────

/** Completa id, código, estado y fecha de las personas pegadas a mano. Devuelve cuántas filas cambió. */
function completarPersonas() {
  _memo = {}; // puede llamarse fuera de api() (menú o al preparar las hojas)
  var filas = leerTabla(HOJA_PERSONAS);
  var hoy = ahoraLocal().hoy;
  var conId = filas.filter(function (f) { return f.id; }).map(function (f) { return { id: String(f.id) }; });
  var codigos = filas.map(function (f) { return String(f.codigo || '').toUpperCase(); }).filter(Boolean);
  var cambiadas = 0;
  filas.forEach(function (f) {
    if (!String(f.nombres || '').trim()) return;
    var cambios = {};
    if (!f.id) { cambios.id = siguienteId(conId, 'P'); conId.push({ id: cambios.id }); }
    if (!f.codigo) {
      var c;
      do { c = aleatorio(ALFABETO_CODIGO, 8); } while (codigos.indexOf(c) >= 0);
      codigos.push(c);
      cambios.codigo = c;
    }
    if (!f.estado) cambios.estado = 'activo';
    if (!f.creado) cambios.creado = hoy;
    if (Object.keys(cambios).length) { actualizarFila(HOJA_PERSONAS, f._fila, cambios); cambiadas++; }
  });
  delete _memo.personas;
  return cambiadas;
}

// ───────────────────────── Acciones públicas ─────────────────────────

function asistenciaEstado(datos) {
  var ctx = contextoPrograma(datos.programa);
  var r = {
    programa: resumenPrograma(ctx.programa),
    programas: ctx.programas.filter(function (p) { return p.activo; }).map(resumenPrograma),
    abierto: ctx.abierto,
    hoy: ctx.ahora.hoy,
    maxPorEnvio: numero(leerConfig().MAX_PERSONAS_POR_ENVIO, 8) || 8
  };
  // La lista de nombres solo se entrega mientras la asistencia está abierta.
  if (ctx.abierto) {
    r.personas = personasDelPrograma(ctx.programa.id).map(personaPublica);
    r.marcadosHoy = idsMarcados(ctx.programa.id, ctx.ahora.hoy);
  }
  return r;
}

function asistenciaMarcar(datos, ses) {
  var ctx = contextoPrograma(datos.programa);
  if (!ctx.abierto) fallo('La asistencia está cerrada. Horario: ' + resumenPrograma(ctx.programa).horario, 'cerrado');

  var ids = unicos((datos.ids || []).map(String));
  var max = numero(leerConfig().MAX_PERSONAS_POR_ENVIO, 8) || 8;
  if (!ids.length) fallo('Elige al menos una persona.');
  if (ids.length > max) fallo('Puedes marcar hasta ' + max + ' personas a la vez.');

  var personas = indexar(personasDelPrograma(ctx.programa.id));
  ids.forEach(function (id) { if (!personas[id]) fallo('Una de las personas elegidas no está en la lista.'); });
  // Si llega el código personal, "quién marca" queda verificado.
  var quien = ses.persona ? personas[ses.persona.id] || ses.persona : personas[String(datos.marcadoPor || '')] || null;

  return conCandado(function () {
    var ya = idsMarcados(ctx.programa.id, ctx.ahora.hoy);
    var nuevos = ids.filter(function (id) { return ya.indexOf(id) < 0; });
    escribirAsistencias(ctx, nuevos.map(function (id) {
      return {
        persona: personas[id],
        metodo: !quien || quien.id === id ? 'personal' : 'por_familiar',
        marcadoPor: quien ? quien.nombre : ''
      };
    }));
    return {
      marcados: nuevos.map(function (id) { return personas[id].nombre; }),
      yaEstaban: ids.filter(function (id) { return ya.indexOf(id) >= 0; })
        .map(function (id) { return personas[id].nombre; }),
      hora: ctx.ahora.hora
    };
  });
}

/** Alguien que no está en la lista se registra (estado "nuevo") y queda marcado. */
function asistenciaRegistrarNuevo(datos, ses) {
  var ctx = contextoPrograma(datos.programa);
  var esAyudante = tieneRol(ses, 'ayudante');
  if (!esAyudante && !ctx.abierto) fallo('La asistencia está cerrada.', 'cerrado');

  var nombres = limpiarNombre(datos.nombres);
  var apellidos = limpiarNombre(datos.apellidos);
  if (!nombres || !apellidos) fallo('Escribe el nombre y el apellido.');
  var fecha = esAyudante && datos.fecha ? validarFecha(datos.fecha) : ctx.ahora.hoy;

  return conCandado(function () {
    var persona = buscarPorNombre(nombres, apellidos);
    var creada = false;
    if (!persona) {
      persona = crearPersona({
        nombres: nombres, apellidos: apellidos, telefono: limpiarTelefono(datos.telefono),
        programas: ctx.programa.id, notas: esAyudante ? 'Registrado por un ayudante' : 'Se registró desde la página'
      });
      creada = true;
    }
    var marcado = false;
    if (idsMarcados(ctx.programa.id, fecha).indexOf(persona.id) < 0) {
      escribirAsistencias(ctx, [{
        persona: persona,
        metodo: esAyudante ? 'ayudante' : 'personal',
        marcadoPor: esAyudante ? ('Ayudante ' + limpiarNombre(datos.ayudante)).trim() : ''
      }], fecha);
      marcado = true;
    }
    var r = { persona: personaPublica(persona), creada: creada, marcado: marcado, hora: ctx.ahora.hora };
    // Solo quien se acaba de crear recibe su código (nunca el de una persona que ya existía).
    if (creada && !esAyudante) r.codigo = persona.codigo;
    return r;
  });
}

// ───────────────────────── Modo ayudante ─────────────────────────

function asistenciaLista(datos) {
  var ctx = contextoPrograma(datos.programa);
  var fecha = datos.fecha ? validarFecha(datos.fecha) : ctx.ahora.hoy;
  var porId = {};
  registrosDe(ctx.programa.id).forEach(function (r) { if (r.fecha === fecha) porId[r.persona_id] = r; });
  return {
    fecha: fecha,
    hoy: ctx.ahora.hoy,
    abierto: ctx.abierto,
    programa: resumenPrograma(ctx.programa),
    programas: ctx.programas.map(resumenPrograma),
    personas: personasDelPrograma(ctx.programa.id).map(function (p) {
      var r = porId[p.id];
      var x = personaPublica(p);
      x.estado = p.estado;
      x.presente = !!r;
      x.hora = r ? r.hora : '';
      return x;
    })
  };
}

function asistenciaAlternar(datos) {
  var ctx = contextoPrograma(datos.programa);
  var fecha = datos.fecha ? validarFecha(datos.fecha) : ctx.ahora.hoy;
  var persona = indexar(personasDelPrograma(ctx.programa.id))[String(datos.id)];
  if (!persona) fallo('Esa persona no está en la lista.');
  var presente = !!datos.presente;

  return conCandado(function () {
    var filas = registrosDe(ctx.programa.id).filter(function (r) {
      return r.fecha === fecha && r.persona_id === persona.id;
    });
    if (presente && !filas.length) {
      escribirAsistencias(ctx, [{
        persona: persona, metodo: 'ayudante',
        marcadoPor: ('Ayudante ' + limpiarNombre(datos.ayudante)).trim()
      }], fecha);
    }
    if (!presente && filas.length) borrarFilas(HOJA_ASISTENCIA, filas.map(function (r) { return r._fila; }));
    return { id: persona.id, presente: presente, hora: ctx.ahora.hora };
  });
}

// ───────────────────────── Panel, perfil y ficha ─────────────────────────

function asistenciaPanel(datos) {

    personasDelPrograma(ctx.programa.id, true),
    registrosDe(ctx.programa.id),
    { umbral: numero(leerConfig().FALTAS_PARA_SEGUIMIENTO, 2) || 2 }
  );
  est.programa = resumenPrograma(ctx.programa);
  est.programas = ctx.programas.map(resumenPrograma);
  est.hoy = ctx.ahora.hoy;
  est.url = urlApp();
  est.hojaUrl = libro().getUrl();

/** Asistencia de una persona en cada programa en que participa (Mi espacio y ficha). */
function asistenciaPerfil(persona) {
  var tz = zonaHoraria();
  var programas = leerProgramas(tz).filter(function (pr) {
    return !persona.programas.length || persona.programas.indexOf(pr.id) >= 0;
  });
  var umbral = numero(leerConfig().FALTAS_PARA_SEGUIMIENTO, 2) || 2;
  return {
    programas: programas.map(function (pr) {
      var registros = registrosDe(pr.id);
      var est = calcularEstadisticas([persona], registros, { umbral: umbral });
      var fila = est.personas[0] || null;
      var mias = {};
      registros.forEach(function (r) { if (r.persona_id === persona.id) mias[r.fecha] = true; });
      var desde = fila && fila.sesiones ? est.porSesion[est.porSesion.length - fila.sesiones].fecha : '';
      return {
        id: pr.id, nombre: pr.nombre, activo: pr.activo, horario: resumenPrograma(pr).horario,
        asistencias: fila ? fila.asistencias : 0,
        sesiones: fila ? fila.sesiones : 0,
        porcentaje: fila ? fila.porcentaje : null,
        faltasSeguidas: fila ? fila.faltasSeguidas : 0,
        ultima: fila ? fila.ultima : '',
        historial: est.porSesion.filter(function (s) { return s.fecha >= desde; }).slice(-16)
          .map(function (s) { return { fecha: s.fecha, asistio: !!mias[s.fecha] }; })
      };
    }).filter(function (x) { return x.activo || x.asistencias > 0; })
  };
}

// ───────────────────────── Estadísticas (función pura) ─────────────────────────

/**
 * personas: [{id, nombre, familia, estado, creado}]
 * registros: [{fecha, persona_id, metodo}]
 * A cada persona solo se le cuentan las sesiones desde que se inscribió
 * (o desde su primera asistencia, si es anterior).
 */
function calcularEstadisticas(personas, registros, opciones) {
  var umbral = (opciones && opciones.umbral) || 2;
  var porFecha = {}, porPersona = {}, metodos = {};
  registros.forEach(function (r) {
    (porFecha[r.fecha] = porFecha[r.fecha] || {})[r.persona_id] = true;
    (porPersona[r.persona_id] = porPersona[r.persona_id] || {})[r.fecha] = true;
    metodos[r.metodo || 'otro'] = (metodos[r.metodo || 'otro'] || 0) + 1;
  });
  var sesiones = Object.keys(porFecha).sort();
  var activas = personas.filter(function (p) { return p.estado !== 'inactivo'; });

  var filas = activas.map(function (p) {
    var fechas = porPersona[p.id] || {};
    var asistidas = Object.keys(fechas).sort();
    var desde = p.creado || '';
    if (asistidas.length && (!desde || asistidas[0] < desde)) desde = asistidas[0];
    var aplicables = sesiones.filter(function (f) { return !desde || f >= desde; });
    var n = aplicables.filter(function (f) { return fechas[f]; }).length;
    var faltas = 0;
    for (var i = aplicables.length - 1; i >= 0 && !fechas[aplicables[i]]; i--) faltas++;
    return {
      id: p.id, nombre: p.nombre, familia: p.familia || '', estado: p.estado,
      asistencias: n, sesiones: aplicables.length,
      porcentaje: aplicables.length ? Math.round(100 * n / aplicables.length) : null,
      ultima: asistidas.length ? asistidas[asistidas.length - 1] : '',
      faltasSeguidas: faltas
    };
  });
  filas.sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });

  var totales = sesiones.map(function (f) { return { fecha: f, total: Object.keys(porFecha[f]).length }; });
  var conPct = filas.filter(function (f) { return f.porcentaje !== null; });
  var ultima = totales[totales.length - 1] || null;

  return {
    resumen: {
      inscritos: activas.length,
      sesiones: sesiones.length,
      promedioPorSesion: totales.length
        ? Math.round(10 * totales.reduce(function (s, t) { return s + t.total; }, 0) / totales.length) / 10 : 0,
      asistenciaMedia: conPct.length
        ? Math.round(conPct.reduce(function (s, f) { return s + f.porcentaje; }, 0) / conPct.length) : null,
      ultimaSesion: ultima ? {
        fecha: ultima.fecha, total: ultima.total,
        porcentaje: activas.length ? Math.round(100 * ultima.total / activas.length) : null
      } : null
    },
    porSesion: totales,
    personas: filas,
    seguimiento: filas.filter(function (f) { return f.sesiones > 0 && f.faltasSeguidas >= umbral; })
      .sort(function (a, b) { return b.faltasSeguidas - a.faltasSeguidas || a.nombre.localeCompare(b.nombre, 'es'); }),
    nuevos: filas.filter(function (f) { return f.estado === 'nuevo'; }),
    metodos: metodos,
    umbral: umbral
  };
}

// ───────────────────────── Horario ─────────────────────────

function estaAbierto(programa, ahora) {
  if (!programa) return false;
  if (esSi(leerConfig().FORZAR_ABIERTO)) return true;
  if (!programa.activo) return false;
  if (programa.fecha_inicio && ahora.hoy < programa.fecha_inicio) return false;
  if (programa.fecha_fin && ahora.hoy > programa.fecha_fin) return false;
  if (programa.dias.indexOf(ahora.dia) < 0) return false;
  var min = minutos(ahora.hora);
  return min >= minutos(programa.hora_inicio) && min <= minutos(programa.hora_fin);
}

function resumenPrograma(p) {
  var dias = describirDias(p.dias);
  return {
    id: p.id, nombre: p.nombre, activo: p.activo,
    horario: (dias ? dias + ', ' : '') + 'de ' + hora12(p.hora_inicio) + ' a ' + hora12(p.hora_fin)
  };
}

// ───────────────────────── Datos ─────────────────────────

function contextoPrograma(idPrograma) {
  var ahora = ahoraLocal();
  var programas = leerProgramas(ahora.tz);
  if (!programas.length) fallo('No hay programas configurados.');
  var programa = idPrograma
    ? programas.filter(function (p) { return p.id === String(idPrograma); })[0]
    : (programas.filter(function (p) { return p.activo; })[0] || programas[0]);
  if (!programa) fallo('Ese programa no existe.');
  return { ahora: ahora, programas: programas, programa: programa, abierto: estaAbierto(programa, ahora) };
}

function leerProgramas(tz) {
  // Las horas se leen como se ven en pantalla para evitar las sorpresas de husos horarios de Sheets.
  var visibles = leerTabla(HOJA_PROGRAMAS, true);
  return leerTabla(HOJA_PROGRAMAS).map(function (f, i) {
    return {
      id: String(f.id || '').trim(),
      nombre: String(f.nombre || f.id || '').trim(),
      dias: parsearDias(f.dias),
      hora_inicio: visibles[i].hora_inicio,
      hora_fin: visibles[i].hora_fin,
      activo: esSi(f.activo),
      fecha_inicio: aFecha(f.fecha_inicio, tz),
      fecha_fin: aFecha(f.fecha_fin, tz)
    };
  }).filter(function (p) { return p.id; });
}

/** Personas de un programa (columna "programas" vacía = participa en todos). */
function personasDelPrograma(idPrograma, incluirInactivos) {
  return leerPersonas().filter(function (p) {
    return (incluirInactivos || p.estado !== 'inactivo') &&
      (!p.programas.length || p.programas.indexOf(idPrograma) >= 0);
  });
}

function registrosDe(idPrograma) {
  var tz = zonaHoraria();
  return leerTabla(HOJA_ASISTENCIA).filter(function (r) {
    return String(r.programa) === idPrograma;
  }).map(function (r) {
    return {
      _fila: r._fila,
      fecha: aFecha(r.fecha, tz),
      persona_id: String(r.persona_id),
      metodo: String(r.metodo || ''),
      hora: r.registrado instanceof Date ? formatear(r.registrado, tz, 'HH:mm') : ''
    };
  });
}

function idsMarcados(idPrograma, fecha) {
  return unicos(registrosDe(idPrograma).filter(function (r) { return r.fecha === fecha; })
    .map(function (r) { return r.persona_id; }));
}

function escribirAsistencias(ctx, items, fecha) {
  agregarFilas(HOJA_ASISTENCIA, items.map(function (it) {
    return {
      registrado: ctx.ahora.fecha, fecha: fecha || ctx.ahora.hoy, programa: ctx.programa.id,
      persona_id: it.persona.id, persona: it.persona.nombre, metodo: it.metodo, marcado_por: it.marcadoPor || ''
    };
  }));
}

// ───────────────────────── Resumen por correo (opcional) ─────────────────────────

function enviarResumenAsistencia() {
  _memo = {};
  var config = leerConfig();
  if (!config.CORREO_RESUMEN) return;
  var ahora = ahoraLocal();
  var cuerpo = [];
  leerProgramas(ahora.tz).filter(function (p) { return p.activo; }).forEach(function (p) {
    var est = calcularEstadisticas(personasDelPrograma(p.id, true), registrosDe(p.id),
      { umbral: numero(config.FALTAS_PARA_SEGUIMIENTO, 2) || 2 });
    var deHoy = est.porSesion.filter(function (s) { return s.fecha === ahora.hoy; })[0];
    if (!deHoy) return;
    cuerpo.push(p.nombre + ' — ' + ahora.hoy + ': ' + deHoy.total + ' de ' + est.resumen.inscritos + ' asistieron.');
    if (est.nuevos.length) cuerpo.push('Nuevos: ' + est.nuevos.map(function (n) { return n.nombre; }).join(', '));
    if (est.seguimiento.length) {
      cuerpo.push('Necesitan seguimiento (' + est.umbral + '+ faltas seguidas):');
      est.seguimiento.forEach(function (s) {
        cuerpo.push('  • ' + s.nombre + ' — ' + s.faltasSeguidas + ' faltas' + (s.ultima ? ', última vez ' + s.ultima : ''));
      });
    }
    cuerpo.push('');
  });
  if (!cuerpo.length) return;
  cuerpo.push('Panel: ' + urlApp() + '?vista=panel');
  avisarPorCorreo(config.CORREO_RESUMEN, 'Asistencia ' + config.NOMBRE_IGLESIA + ' — ' + ahora.hoy, cuerpo.join('\n'));
}

// ── 30_Consejeria.gs ──
/**
 * MÓDULO CONSEJERÍA: citas presenciales o virtuales según la disponibilidad de cada consejero.
 *
 *   Disponibilidad  bloques semanales de cada consejero (p. ej. martes 18:00–20:00, citas de 45 min)
 *   Ausencias       fechas en que un consejero no atiende (viajes, vacaciones)
 *   Citas           una fila por cita; el motivo y las notas solo los ven la persona y su consejero
 *
 * Un consejero es una persona con el rol "consejero" (o "maestro"/"pastor") en la hoja Personas.
 * Cada consejero administra sus horarios desde su propio Mi espacio.
 */

var HOJA_DISPONIBILIDAD = 'Disponibilidad';
var HOJA_AUSENCIAS = 'Ausencias';
var HOJA_CITAS = 'Citas';
var ESTADOS_CITA = ['agendada', 'realizada', 'no_asistio', 'cancelada'];

var MODULO_CONSEJERIA = {
  id: 'consejeria',
  nombre: 'Consejería',
  hojas: {
    Disponibilidad: ['id', 'consejero_id', 'consejero', 'dias', 'hora_inicio', 'hora_fin', 'duracion_min',
      'modalidad', 'lugar', 'enlace', 'desde', 'hasta', 'activo'],
    Ausencias: ['id', 'consejero_id', 'desde', 'hasta', 'motivo'],
    Citas: ['id', 'creado', 'persona_id', 'persona', 'consejero_id', 'consejero', 'fecha', 'hora',
      'duracion_min', 'modalidad', 'lugar', 'enlace', 'motivo', 'estado', 'notas_consejero',
      'actualizado', 'evento_id']
  },
  config: [
    ['CITAS_DIAS_ADELANTE', '21', 'Hasta cuántos días adelante se puede agendar una consejería'],
    ['CITAS_ANTICIPACION_HORAS', '12', 'Con cuántas horas de anticipación mínima se agenda'],
    ['CITAS_MAX_ACTIVAS', '2', 'Cuántas citas futuras puede tener una persona a la vez'],
    ['CITAS_CALENDARIO_ID', '', 'Opcional: id de un Google Calendar donde crear cada cita (con invitación a ambos)']
  ],
  acciones: {
    opciones: { requiere: 'persona', fn: consejeriaOpciones },
    horarios: { requiere: 'persona', fn: consejeriaHorarios },
    agendar: { requiere: 'persona', fn: consejeriaAgendar },
    cancelar: { requiere: 'persona', fn: consejeriaCancelar },
    agenda: { requiere: 'consejero', fn: consejeriaAgenda },
    actualizar: { requiere: 'consejero', fn: consejeriaActualizar },
    guardarBloque: { requiere: 'consejero', fn: consejeriaGuardarBloque },
    quitarBloque: { requiere: 'consejero', fn: consejeriaQuitarBloque },
    guardarAusencia: { requiere: 'consejero', fn: consejeriaGuardarAusencia },
    quitarAusencia: { requiere: 'consejero', fn: consejeriaQuitarAusencia },
    panel: { requiere: 'admin', fn: consejeriaPanel }
  },
  perfil: consejeriaPerfil,
  ficha: consejeriaFicha,
  preparar: function () {
    hoja(HOJA_DISPONIBILIDAD).getRange('A:M').setNumberFormat('@');
    hoja(HOJA_AUSENCIAS).getRange('A:E').setNumberFormat('@');
    hoja(HOJA_CITAS).getRange('A:Q').setNumberFormat('@');
  }
};

// ───────────────────────── Lectura ─────────────────────────

function consejeros() {
  return leerPersonas().filter(function (p) { return p.estado !== 'inactivo' && p.roles.indexOf('consejero') >= 0; });
}

function leerBloques() {
  return leerTabla(HOJA_DISPONIBILIDAD, true).filter(function (f) { return f.consejero_id; }).map(function (f) {
    return {
      _fila: f._fila, id: String(f.id || ''), consejero_id: String(f.consejero_id).trim(),
      dias: parsearDias(f.dias), hora_inicio: f.hora_inicio, hora_fin: f.hora_fin,
      duracion: numero(f.duracion_min, 45) || 45,
      modalidad: normalizarModalidad(f.modalidad),
      lugar: String(f.lugar || '').trim(), enlace: String(f.enlace || '').trim(),
      desde: aFecha(f.desde), hasta: aFecha(f.hasta),
      activo: f.activo === '' || f.activo === undefined ? true : esSi(f.activo)
    };
  });
}

function leerAusencias() {
  return leerTabla(HOJA_AUSENCIAS, true).filter(function (f) { return f.consejero_id && f.desde; }).map(function (f) {
    var desde = aFecha(f.desde);
    return { _fila: f._fila, id: String(f.id || ''), consejero_id: String(f.consejero_id).trim(),
      desde: desde, hasta: aFecha(f.hasta) || desde, motivo: String(f.motivo || '') };
  });
}

function leerCitas() {
  return leerTabla(HOJA_CITAS, true).filter(function (f) { return f.id; }).map(function (f) {
    return {
      _fila: f._fila, id: String(f.id), creado: f.creado,
      persona_id: String(f.persona_id), persona: f.persona,
      consejero_id: String(f.consejero_id), consejero: f.consejero,
      fecha: aFecha(f.fecha), hora: hhmm(minutos(f.hora)), duracion: numero(f.duracion_min, 45) || 45,
      modalidad: normalizarModalidad(f.modalidad), lugar: f.lugar, enlace: f.enlace,
      motivo: f.motivo, estado: normalizar(f.estado) || 'agendada',
      notas: f.notas_consejero, evento_id: f.evento_id
    };
  });
}

function normalizarModalidad(m) {
  m = normalizar(m);
  if (/virtual|online|zoom|meet/.test(m)) return 'virtual';
  if (/presencial|iglesia|oficina/.test(m)) return 'presencial';
  return 'ambas';
}

function esFutura(cita, ahora) {
  return cita.fecha + ' ' + cita.hora > ahora.hoy + ' ' + ahora.hora;
}

function citaPublica(c, verMotivo) {
  var x = {
    id: c.id, fecha: c.fecha, hora: c.hora, duracion: c.duracion, modalidad: c.modalidad,
    lugar: c.lugar, enlace: c.modalidad === 'virtual' ? c.enlace : '', estado: c.estado,
    consejero_id: c.consejero_id, consejero: c.consejero, persona_id: c.persona_id, persona: c.persona
  };
  if (verMotivo) { x.motivo = c.motivo; x.notas = c.notas; }
  return x;
}

// ───────────────────────── Horarios disponibles (función pura) ─────────────────────────

/**
 * Genera los horarios libres a partir de los bloques semanales.
 *   bloques:   [{consejero_id, dias:[1..7], hora_inicio, hora_fin, duracion, modalidad, lugar, enlace, desde, hasta, activo}]
 *   ausencias: [{consejero_id, desde, hasta}]
 *   citas:     [{consejero_id, fecha, hora, duracion, estado}]
 *   op:        {desde: 'aaaa-mm-dd', dias: n, limite: 'aaaa-mm-dd HH:mm' (no ofrecer antes de esto)}
 * Devuelve [{fecha, hora, consejero_id, duracion, modalidades:[…], lugar, enlace}] ordenado.
 */
function generarHorarios(bloques, ausencias, citas, op) {
  var ocupadas = citas.filter(function (c) { return c.estado !== 'cancelada'; });
  var vistos = {};
  var salida = [];
  for (var d = 0; d < op.dias; d++) {
    var fecha = sumarDias(op.desde, d);
    var dia = diaDeSemana(fecha);
    bloques.forEach(function (b) {
      if (!b.activo || b.dias.indexOf(dia) < 0) return;
      if ((b.desde && fecha < b.desde) || (b.hasta && fecha > b.hasta)) return;
      var ausente = ausencias.some(function (a) {
        return a.consejero_id === b.consejero_id && fecha >= a.desde && fecha <= a.hasta;
      });
      if (ausente) return;
      var ini = minutos(b.hora_inicio), fin = minutos(b.hora_fin);
      if (isNaN(ini) || isNaN(fin)) return;
      for (var t = ini; t + b.duracion <= fin; t += b.duracion) {
        var hora = hhmm(t);
        if (fecha + ' ' + hora < op.limite) continue;
        var choca = ocupadas.some(function (c) {
          if (c.consejero_id !== b.consejero_id || c.fecha !== fecha) return false;
          var ci = minutos(c.hora);
          return ci < t + b.duracion && t < ci + c.duracion;
        });
        if (choca) continue;
        var clave = b.consejero_id + '|' + fecha + '|' + hora;
        var mods = b.modalidad === 'ambas' ? ['presencial', 'virtual'] : [b.modalidad];
        if (vistos[clave]) {
          mods.forEach(function (m) { if (vistos[clave].modalidades.indexOf(m) < 0) vistos[clave].modalidades.push(m); });
          continue;
        }
        vistos[clave] = { fecha: fecha, hora: hora, consejero_id: b.consejero_id, duracion: b.duracion,
          modalidades: mods.slice(), lugar: b.lugar, enlace: b.enlace };
        salida.push(vistos[clave]);
      }
    });
  }
  return salida.sort(function (a, b) {
    return (a.fecha + a.hora + a.consejero_id) < (b.fecha + b.hora + b.consejero_id) ? -1 : 1;
  });
}

function horariosLibres(filtro) {
  var config = leerConfig();
  var ahora = ahoraLocal();
  var limite = formatear(new Date(ahora.fecha.getTime() + numero(config.CITAS_ANTICIPACION_HORAS, 12) * 3600000),
    ahora.tz, 'yyyy-MM-dd HH:mm');
  var ids = consejeros().map(function (c) { return c.id; });
  var bloques = leerBloques().filter(function (b) {
    return ids.indexOf(b.consejero_id) >= 0 && b.consejero_id !== filtro.excluir &&
      (!filtro.consejero || b.consejero_id === filtro.consejero);
  });
  var libres = generarHorarios(bloques, leerAusencias(), leerCitas(),
    { desde: ahora.hoy, dias: numero(config.CITAS_DIAS_ADELANTE, 21) || 21, limite: limite });
  if (filtro.modalidad === 'presencial' || filtro.modalidad === 'virtual') {
    libres = libres.filter(function (h) { return h.modalidades.indexOf(filtro.modalidad) >= 0; });
  }
  var nombres = indexar(consejeros());
  libres.forEach(function (h) { h.consejero = nombres[h.consejero_id].nombre; });
  return libres;
}

// ───────────────────────── Acciones de la persona ─────────────────────────

function consejeriaOpciones(datos, ses) {
  var bloques = leerBloques();
  var ahora = ahoraLocal();
  var activas = leerCitas().filter(function (c) {
    return c.persona_id === ses.persona.id && c.estado === 'agendada' && esFutura(c, ahora);
  });
  return {
    consejeros: consejeros().filter(function (c) { return c.id !== ses.persona.id; }).map(function (c) {
      var mods = {};
      bloques.forEach(function (b) {
        if (b.consejero_id !== c.id || !b.activo) return;
        (b.modalidad === 'ambas' ? ['presencial', 'virtual'] : [b.modalidad]).forEach(function (m) { mods[m] = true; });
      });
      return { id: c.id, nombre: c.nombre, modalidades: Object.keys(mods).sort() };
    }).filter(function (c) { return c.modalidades.length; }),
    maxActivas: numero(leerConfig().CITAS_MAX_ACTIVAS, 2) || 2,
    activas: activas.length
  };
}

function consejeriaHorarios(datos, ses) {
  return { horarios: horariosLibres({ consejero: datos.consejero || '', modalidad: datos.modalidad || '', excluir: ses.persona.id }) };
}

function consejeriaAgendar(datos, ses) {
  var fecha = validarFecha(datos.fecha);
  var hora = hhmm(minutos(datos.hora));
  var modalidad = normalizarModalidad(datos.modalidad);
  if (modalidad === 'ambas') fallo('Elige si la cita será presencial o virtual.');
  var motivo = limpiarTexto(datos.motivo, 500);

  return conCandado(function () {
    var persona = ses.persona;
    var ahora = ahoraLocal();
    var max = numero(leerConfig().CITAS_MAX_ACTIVAS, 2) || 2;
    var mias = leerCitas().filter(function (c) {
      return c.persona_id === persona.id && c.estado === 'agendada' && esFutura(c, ahora);
    });
    if (mias.length >= max) fallo('Ya tienes ' + mias.length + ' cita(s) pendiente(s). Cancela una para agendar otra.');
    if (mias.some(function (c) { return c.fecha === fecha && c.hora === hora; })) fallo('Ya tienes una cita a esa hora.');

    // Se vuelve a calcular dentro del candado: si alguien tomó el horario, se avisa.
    var libre = horariosLibres({ consejero: String(datos.consejero || ''), excluir: persona.id }).filter(function (h) {
      return h.fecha === fecha && h.hora === hora && h.modalidades.indexOf(modalidad) >= 0;
    })[0];
    if (!libre) fallo('Ese horario ya no está disponible. Elige otro.', 'ocupado');

    var consejero = personaPorId(libre.consejero_id);
    var cita = {
      id: siguienteId(leerCitas(), 'C'), creado: formatear(ahora.fecha, ahora.tz, 'yyyy-MM-dd HH:mm'),
      persona_id: persona.id, persona: persona.nombre,
      consejero_id: consejero.id, consejero: consejero.nombre,
      fecha: fecha, hora: hora, duracion_min: libre.duracion, modalidad: modalidad,
      lugar: modalidad === 'presencial' ? libre.lugar : '', enlace: modalidad === 'virtual' ? libre.enlace : '',
      motivo: motivo, estado: 'agendada', notas_consejero: '', actualizado: '', evento_id: ''
    };
    cita.evento_id = crearEventoCalendario(cita, persona, consejero);
    agregarFilas(HOJA_CITAS, [cita]);
    avisarCita('Nueva cita de consejería', cita, persona, consejero);
    return { cita: citaPublica(leerCitas().filter(function (c) { return c.id === cita.id; })[0], true) };
  });
}

function consejeriaCancelar(datos, ses) {
  return conCandado(function () {
    var cita = leerCitas().filter(function (c) { return c.id === String(datos.id); })[0];
    var esSuya = cita && (cita.persona_id === ses.persona.id || cita.consejero_id === ses.persona.id);
    if (!esSuya) fallo('No encontramos esa cita.');
    if (cita.estado !== 'agendada' || !esFutura(cita, ahoraLocal())) fallo('Esa cita ya no se puede cancelar.');
    cambiarEstadoCita(cita, 'cancelada', ses.persona);
    return { id: cita.id, estado: 'cancelada' };
  });
}

/** Sección de consejería en "Mi espacio". */
function consejeriaPerfil(persona) {
  var ahora = ahoraLocal();
  var mias = leerCitas().filter(function (c) { return c.persona_id === persona.id; });
  var proximas = mias.filter(function (c) { return c.estado === 'agendada' && esFutura(c, ahora); })
    .sort(porFechaHora);
  var anteriores = mias.filter(function (c) { return proximas.indexOf(c) < 0; }).sort(porFechaHora).reverse().slice(0, 5);
  var esConsejero = persona.roles.indexOf('consejero') >= 0;
  var r = {
    proximas: proximas.map(function (c) { return citaPublica(c, true); }),
    anteriores: anteriores.map(function (c) { return citaPublica(c, false); }),
    hayConsejeros: consejeros().some(function (c) { return c.id !== persona.id; }),
    esConsejero: esConsejero
  };
  if (esConsejero) {
    r.agendaHoy = leerCitas().filter(function (c) {
      return c.consejero_id === persona.id && c.estado === 'agendada' && c.fecha >= ahora.hoy;
    }).length;
  }
  return r;
}

/** Lo que ve el administrador en la ficha: cantidades, nunca motivos ni notas. */
function consejeriaFicha(persona) {
  var ahora = ahoraLocal();
  var mias = leerCitas().filter(function (c) { return c.persona_id === persona.id; });
  var cuenta = function (f) { return mias.filter(f).length; };
  var pasadas = mias.filter(function (c) { return c.estado === 'realizada'; }).sort(porFechaHora);
  return {
    proximas: cuenta(function (c) { return c.estado === 'agendada' && esFutura(c, ahora); }),
    realizadas: pasadas.length,
    noAsistio: cuenta(function (c) { return c.estado === 'no_asistio'; }),
    ultima: pasadas.length ? pasadas[pasadas.length - 1].fecha : '',
    consejeros: unicos(mias.map(function (c) { return c.consejero; }))
  };
}

// ───────────────────────── Acciones del consejero ─────────────────────────

function consejeriaAgenda(datos, ses) {
  var ahora = ahoraLocal();
  var yo = ses.persona.id;
  var personas = indexar(leerPersonas());
  var mias = leerCitas().filter(function (c) { return c.consejero_id === yo; }).sort(porFechaHora);
  var conContacto = function (c) {
    var x = citaPublica(c, true);
    var p = personas[c.persona_id];
    x.telefono = p ? p.telefono : '';
    x.correo = p ? p.correo : '';
    return x;
  };
  var hace30 = sumarDias(ahora.hoy, -30);
  return {
    proximas: mias.filter(function (c) { return c.estado === 'agendada' && c.fecha >= ahora.hoy; }).map(conContacto),
    recientes: mias.filter(function (c) {
      return (c.estado !== 'agendada' || c.fecha < ahora.hoy) && c.fecha >= hace30;
    }).reverse().map(conContacto),
    bloques: leerBloques().filter(function (b) { return b.consejero_id === yo; }).map(function (b) {
      return { id: b.id, dias: b.dias, texto: describirDias(b.dias), hora_inicio: hhmm(minutos(b.hora_inicio)),
        hora_fin: hhmm(minutos(b.hora_fin)), duracion: b.duracion, modalidad: b.modalidad,
        lugar: b.lugar, enlace: b.enlace, activo: b.activo };
    }),
    ausencias: leerAusencias().filter(function (a) { return a.consejero_id === yo && a.hasta >= ahora.hoy; })
      .map(function (a) { return { id: a.id, desde: a.desde, hasta: a.hasta, motivo: a.motivo }; }),
    hoy: ahora.hoy
  };
}

function consejeriaActualizar(datos, ses) {
  return conCandado(function () {
    var cita = leerCitas().filter(function (c) { return c.id === String(datos.id); })[0];
    if (!cita || cita.consejero_id !== ses.persona.id) fallo('No encontramos esa cita en tu agenda.');
    if (datos.estado) {
      if (ESTADOS_CITA.indexOf(datos.estado) < 0) fallo('Estado no válido.');
      if (datos.estado !== cita.estado) cambiarEstadoCita(cita, datos.estado, ses.persona);
    }
    if ('notas' in datos) actualizarFila(HOJA_CITAS, cita._fila, { notas_consejero: limpiarTexto(datos.notas, 2000) });
    var nueva = leerCitas().filter(function (c) { return c.id === cita.id; })[0];
    return { cita: citaPublica(nueva, true) };
  });
}

function consejeriaGuardarBloque(datos, ses) {
  var dias = parsearDias(Array.isArray(datos.dias) ? datos.dias.join(',') : datos.dias);
  if (!dias.length) fallo('Elige al menos un día.');
  var ini = minutos(datos.hora_inicio), fin = minutos(datos.hora_fin);
  var dur = Number(datos.duracion) || 45;
  if (isNaN(ini) || isNaN(fin) || fin - ini < dur) fallo('Revisa las horas: el bloque debe durar al menos una cita.');
  if (dur < 15 || dur > 180) fallo('La duración de cada cita debe estar entre 15 y 180 minutos.');
  var modalidad = normalizarModalidad(datos.modalidad);
  var enlace = String(datos.enlace || '').trim().slice(0, 300);
  if (enlace && !/^https:\/\//.test(enlace)) fallo('El enlace de la videollamada debe empezar con https://');
  if (modalidad !== 'presencial' && !enlace) fallo('Para citas virtuales pon el enlace de tu videollamada (Meet, Zoom…).');
  return conCandado(function () {
    var id = siguienteId(leerTabla(HOJA_DISPONIBILIDAD), 'D');
    agregarFilas(HOJA_DISPONIBILIDAD, [{
      id: id, consejero_id: ses.persona.id, consejero: ses.persona.nombre,
      dias: dias.map(function (d) { return NOMBRES_DIA[d]; }).join(', '),
      hora_inicio: hhmm(ini), hora_fin: hhmm(fin), duracion_min: String(dur), modalidad: modalidad,
      lugar: limpiarTexto(datos.lugar, 120), enlace: enlace, desde: '', hasta: '', activo: 'si'
    }]);
    return { id: id };
  });
}

function consejeriaQuitarBloque(datos, ses) {
  return conCandado(function () {
    var b = leerBloques().filter(function (x) { return x.id === String(datos.id) && x.consejero_id === ses.persona.id; })[0];
    if (!b) fallo('No encontramos ese horario.');
    borrarFilas(HOJA_DISPONIBILIDAD, [b._fila]);
    return { id: b.id };
  });
}

function consejeriaGuardarAusencia(datos, ses) {
  var desde = validarFecha(datos.desde), hasta = datos.hasta ? validarFecha(datos.hasta) : desde;
  if (hasta < desde) fallo('La fecha final es anterior a la inicial.');
  return conCandado(function () {
    var id = siguienteId(leerTabla(HOJA_AUSENCIAS), 'A');
    agregarFilas(HOJA_AUSENCIAS, [{ id: id, consejero_id: ses.persona.id, desde: desde, hasta: hasta,
      motivo: limpiarTexto(datos.motivo, 120) }]);
    var chocan = leerCitas().filter(function (c) {
      return c.consejero_id === ses.persona.id && c.estado === 'agendada' && c.fecha >= desde && c.fecha <= hasta;
    });
    return { id: id, citasEnEsasFechas: chocan.length };
  });
}

function consejeriaQuitarAusencia(datos, ses) {
  return conCandado(function () {
    var a = leerAusencias().filter(function (x) { return x.id === String(datos.id) && x.consejero_id === ses.persona.id; })[0];
    if (!a) fallo('No encontramos esa ausencia.');
    borrarFilas(HOJA_AUSENCIAS, [a._fila]);
    return { id: a.id };
  });
}

// ───────────────────────── Panel del administrador ─────────────────────────

function consejeriaPanel() {
  var ahora = ahoraLocal();
  var citas = leerCitas();
  var en7 = sumarDias(ahora.hoy, 7);
  var porEstado = {};
  ESTADOS_CITA.forEach(function (e) { porEstado[e] = 0; });
  citas.forEach(function (c) { porEstado[c.estado] = (porEstado[c.estado] || 0) + 1; });
  return {
    porEstado: porEstado,
    proximos7: citas.filter(function (c) { return c.estado === 'agendada' && c.fecha >= ahora.hoy && c.fecha <= en7; }).length,
    consejeros: consejeros().map(function (k) {
      var suyas = citas.filter(function (c) { return c.consejero_id === k.id; });
      return {
        id: k.id, nombre: k.nombre,
        proximas: suyas.filter(function (c) { return c.estado === 'agendada' && esFutura(c, ahora); }).length,
        realizadas: suyas.filter(function (c) { return c.estado === 'realizada'; }).length,
        bloques: leerBloques().filter(function (b) { return b.consejero_id === k.id && b.activo; }).length
      };
    }),
    horariosLibres: horariosLibres({}).length
  };
}

// ───────────────────────── Avisos ─────────────────────────

function cambiarEstadoCita(cita, estado, quien) {
  var ahora = ahoraLocal();
  actualizarFila(HOJA_CITAS, cita._fila, { estado: estado, actualizado: formatear(ahora.fecha, ahora.tz, 'yyyy-MM-dd HH:mm') });
  if (estado === 'cancelada') {
    borrarEventoCalendario(cita.evento_id);
    avisarCita('Cita cancelada por ' + quien.nombre, cita, personaPorId(cita.persona_id), personaPorId(cita.consejero_id));
  }
}

function avisarCita(asunto, cita, persona, consejero) {
  var texto = [
    asunto, '',
    'Fecha: ' + cita.fecha + ' a las ' + hora12(cita.hora) + ' (' + (cita.duracion_min || cita.duracion) + ' min)',
    'Persona: ' + cita.persona,
    'Consejero(a): ' + cita.consejero,
