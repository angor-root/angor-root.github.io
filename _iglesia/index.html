  try {
    var tz = zonaHoraria();
    var inicio = Utilities.parseDate(cita.fecha + ' ' + cita.hora, tz, 'yyyy-MM-dd HH:mm');
    var fin = new Date(inicio.getTime() + Number(cita.duracion_min) * 60000);
    var invitados = [persona.correo, consejero.correo].filter(Boolean).join(',');
    var evento = CalendarApp.getCalendarById(id).createEvent(
      'Consejería: ' + persona.nombre + ' con ' + consejero.nombre, inicio, fin,
      { location: cita.lugar || cita.enlace || '', description: 'Cita ' + cita.id, guests: invitados, sendInvites: !!invitados });

  } catch (e) {

    return '';
  }

/** Llama a api('modulo.accion'). El código personal y el PIN viajan solos si existen. */
function llamar(accion, datos) {
  datos = datos || {};
  if (App.codigo && datos.codigo === undefined) datos.codigo = App.codigo;
  if (App.pin && datos.pin === undefined) datos.pin = App.pin;
  return new Promise(function (resolver, rechazar) {
    function manejar(r) {
      if (r && r.app) {
        var cambio = r.app.modulos.join() !== App.info.modulos.join();
        App.info = r.app; guardar('info', r.app);
        if (cambio) App.pintarNav(App.rutaActual()); // la primera vez aún no se sabía qué módulos hay
      }
      if (r && r.ok) return resolver(r);
      var e = new Error((r && r.error) || 'Error inesperado.');
      e.codigo = r && r.codigoError;
      rechazar(e);
    }
    function sinConexion() { rechazar(new Error('No hay conexión. Revisa tu internet e intenta de nuevo.')); }
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(manejar).withFailureHandler(sinConexion).api(accion, datos);
    } else if (API_URL) {
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: accion, datos: datos }) })
        .then(function (r) { return r.json(); }).then(manejar, sinConexion);
    } else {
      rechazar(new Error('Falta configurar API_URL en la página.'));
    }
  });
}
function parametros() {
  return new Promise(function (resolver) {
    if (window.google && google.script && google.script.url) {
      google.script.url.getLocation(function (l) { resolver(l.parameter || {}); });
    } else {
      var o = {}; new URLSearchParams(location.search).forEach(function (v, k) { o[k] = v; }); resolver(o);
    }
  });
}

function cabecera(titulo) {
  return '<header class="cabecera"><div class="iglesia">' + esc(App.info.iglesia) + '</div>' +
    '<div class="programa">' + esc(titulo || '') + '</div></header>';

function pie() {

}
function conectarPie() { on('#servidores', 'click', function () { App.ir('servidores'); }); }
function mostrarError(err, reintentar, titulo) {
  app.innerHTML = cabecera(titulo) + '<div class="tarjeta centro"><h2>No se pudo cargar</h2><p class="suave">' +
    esc(err.message) + '</p><button class="boton" id="reintentar">Intentar de nuevo</button></div>';
  on('#reintentar', 'click', reintentar);
}

/** Buscador de personas reutilizable. lista() devuelve [{id, nombre, familia}]. */
function conectarBusqueda(input, ul, lista, alElegir, extra) {
  if (!input) return;
  function pintar() {
    var q = input.value;
    if (!norm(q)) { ul.innerHTML = ''; return; }
    var r = lista().filter(function (p) { return coincide(p.nombre, q); })
      .sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); }).slice(0, 8);
    if (!r.length) { ul.innerHTML = '<li class="suave pequeno">No hay coincidencias. Prueba solo con tu primer nombre o toca «No encuentro mi nombre».</li>'; return; }
    ul.innerHTML = r.map(function (p) {
      return '<li><button class="opcion" data-id="' + esc(p.id) + '"><span>' + esc(p.nombre) +
        (p.familia ? '<br><small>Familia ' + esc(p.familia) + '</small>' : '') + '</span>' +
        (extra ? extra(p) : '') + '</button></li>';
    }).join('');
    Array.prototype.forEach.call(ul.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { alElegir(b.getAttribute('data-id')); });
    });
  }
  input.addEventListener('input', pintar);
  setTimeout(function () { if (document.body.contains(input)) input.focus(); }, 50);
}

function dibujarQR(el, texto, tam) {
  el.innerHTML = '';
  if (window.QRCode) {
    new QRCode(el, { text: texto, width: tam, height: tam, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  } else {
    el.innerHTML = '<p class="pequeno" style="color:#000;max-width:' + tam + 'px">No se pudo cargar el generador de QR. Revisa la conexión.</p>';
  }
}

/** Imprime una hoja con un QR (cartel de la entrada o tarjeta personal). */
function imprimirQR(titulo, subtitulo, url, textos) {
  var c = document.getElementById('cartel');
  c.innerHTML = '<p>' + esc(App.info.iglesia) + '</p><h1>' + esc(titulo) + '</h1><p>' + esc(subtitulo) + '</p>' +
    '<div id="qrCartel"></div>' + (textos || []).map(function (t) { return '<p style="font-size:18px">' + esc(t) + '</p>'; }).join('');
  dibujarQR(document.getElementById('qrCartel'), url, 360);
  setTimeout(function () { window.print(); }, 300);
}

function copiar(texto) {
  (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(
    function () { toast('Copiado'); }, function () { prompt('Copia el texto:', texto); });
}

function enlaceWhatsApp(telefono, texto) {
  var num = String(telefono || '').replace(/\D/g, '');
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(texto);
}

        '<span>' + esc(p.nombre) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
        '<span class="marca">' + (p.presente ? '✓ ' + esc(p.hora ? hora12(p.hora) : 'Presente') : 'Marcar') + '</span></button></li>';

      .then(function (r) { p.hora = r.presente ? r.hora : ''; pintarFilas(); },
        function (err) { p.presente = antes.presente; p.hora = antes.hora; pintarFilas(); errorServidor(err); });

  function selectorProgramas(programas) {
    if (!programas || programas.length < 2) return '';

    }).join('') + '</select>';
  }

  // ================================================================
  //  Servidores: panel de asistencia

  App.pestanaServidor({ id: 'panel', nombre: 'Asistencia', rol: 'admin', modulo: 'asistencia', ancho: true, abrir: cargarPanel });

  function cargarPanel(zona) {

      A.panel = r; App.programa = r.programa.id;
      pintarPanel(zona);
    }, errorServidor);
  }

  function kpi(valor, nombre) {
    return '<div class="kpi"><div class="valor">' + esc(valor) + '</div><div class="nombre">' + esc(nombre) + '</div></div>';
  }

  function pintarPanel(zona) {
    var r = A.panel, res = r.resumen;

    html += '</div>';
    if (r.nuevos.length) {

      '<th><button data-orden="nombre">Nombre' + (A.orden === 'nombre' ? ' ↓' : '') + '</button></th>' +
      '<th class="num"><button data-orden="porcentaje">Asistencia' + (A.orden === 'porcentaje' ? ' ↑' : '') + '</button></th>' +
      '<th class="num">Asistió</th><th>Última vez</th></tr></thead><tbody>' +
      ordenar(r.personas).map(function (p) {
        return '<tr class="clic" data-id="' + esc(p.id) + '"><td>' + esc(p.nombre) + (p.estado === 'nuevo' ? ' <span class="suave pequeno">(nuevo)</span>' : '') + '</td>' +

      }).join('') + '</tbody></table></div></div>';
    var url = (r.url || location.href.split('?')[0]) + (r.programas.length > 1 ? '?p=' + encodeURIComponent(App.programa) : '');

  function ordenar(lista) {
    var l = lista.slice();
    if (A.orden === 'porcentaje') l.sort(function (a, b) { return (a.porcentaje === null ? 101 : a.porcentaje) - (b.porcentaje === null ? 101 : b.porcentaje); });
    return l;
  }

  /** Barras verticales, una serie: asistentes por sesión, con línea de referencia de inscritos. */
  function dibujarGrafico(el, datos, inscritos) {
    var W = 720, H = 260, m = { t: 16, r: 12, b: 32, l: 36 };
    var ancho = W - m.l - m.r, alto = H - m.t - m.b;
    var maxV = Math.max(inscritos || 0, Math.max.apply(null, datos.map(function (d) { return d.total; })), 1);
    var paso = maxV <= 10 ? 2 : maxV <= 25 ? 5 : maxV <= 60 ? 10 : 20;
    var tope = Math.ceil(maxV / paso) * paso;
    var y = function (v) { return m.t + alto - (v / tope) * alto; };
    var banda = ancho / datos.length;
    var bw = Math.max(4, Math.min(36, banda - 2));
    var cadaN = Math.ceil(datos.length / Math.floor(ancho / 48));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Asistentes por sesión">';
    for (var v = 0; v <= tope; v += paso) {
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grilla)" stroke-width="1"/>' +
        '<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }
    datos.forEach(function (d, i) {
      var cx = m.l + banda * i + banda / 2, x = cx - bw / 2, top = y(d.total), base = y(0);
      var r = Math.min(4, bw / 2, base - top);
      if (d.total > 0) {
        s += '<path fill="var(--serie-1)" d="M' + x + ',' + base + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top +
          'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + base + 'Z"/>';
      }
      if (i % cadaN === 0) s += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + fechaCorta(d.fecha) + '</text>';
      s += '<rect class="zona" data-i="' + i + '" x="' + (m.l + banda * i) + '" y="' + m.t + '" width="' + banda + '" height="' + alto + '" fill="transparent"/>';
    });
    if (inscritos) {
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(inscritos) + '" y2="' + y(inscritos) + '" stroke="var(--texto-3)" stroke-width="1.5" stroke-dasharray="4 4"/>' +
        '<text x="' + (W - m.r) + '" y="' + (y(inscritos) - 6) + '" text-anchor="end">Inscritos: ' + inscritos + '</text>';
    }
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--texto-3)" stroke-width="1"/></svg>';
    el.innerHTML = s + '<div class="tooltip" id="tip"></div>';
    var tip = el.querySelector('#tip');
    Array.prototype.forEach.call(el.querySelectorAll('.zona'), function (z) {
      function mostrar() {
        var d = datos[Number(z.getAttribute('data-i'))];
        var caja = el.getBoundingClientRect(), zc = z.getBoundingClientRect();
        tip.innerHTML = '<b>' + esc(fechaLarga(d.fecha)) + '</b><br>' + d.total + ' asistentes' +
          (inscritos ? ' · ' + Math.round(100 * d.total / inscritos) + '%' : '');
        tip.style.display = 'block';
        tip.style.left = Math.min(Math.max(zc.left - caja.left + zc.width / 2, 80), caja.width - 80) + 'px';
        tip.style.top = (y(d.total) / H) * caja.height + 'px';
      }
      z.addEventListener('mouseenter', mostrar);
      z.addEventListener('click', mostrar);
      z.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    });
  }
})();
</script>

  <script>

      '<p class="suave pequeno" style="margin-top:16px">¿No tienes código? Pídele a un líder tu <b>enlace personal</b> (te llega por WhatsApp). ' +

      on('#copiarP', 'click', function () { copiar(p.enlace); });
      on('#tarjetaP', 'click', function () {
        imprimirQR(p.nombre, 'Tu enlace personal: escanéalo con la cámara de tu celular', p.enlace,
          ['Guárdalo: con él ves tu asistencia' + (App.activo('consejeria') ? ' y agendas consejería.' : '.')]);
      });
    }
  }

  function dato(nombre, valor) {
    return '<div class="dato"><span>' + esc(nombre) + '</span><span>' + esc(valor === '' || valor == null ? '—' : valor) + '</span></div>';
  }
})();
</script>

  <script>
/* MÓDULO CONSEJERÍA (página): mis citas, agendar, agenda del consejero y panel. */
(function () {
  var MODALIDAD = { presencial: 'Presencial', virtual: 'Virtual' };
  var ESTADO = { agendada: 'Agendada', realizada: 'Realizada', no_asistio: 'No asistió', cancelada: 'Cancelada' };
  var C = { opciones: null, consejero: '', modalidad: '', horarios: [], fecha: '', elegido: null };

  App.vista('agendar', function () { if (!App.codigo) return App.ir('mi'); pasoConsejero(); });
  App.vista('agenda', cargarAgenda);

  function lugarDe(c) {
    if (c.modalidad === 'virtual') return icono('video', 18) + ' Virtual';
    return icono('lugar', 18) + ' ' + esc(c.lugar || 'Presencial');
  }

  // ================================================================
  //  Mi espacio: mis citas
  // ================================================================
  App.seccionPerfil('consejeria', function (d, op) {
    var html = '<div class="tarjeta"><div class="paso">Consejería</div>';
    if (d.proximas.length) {
      html += '<h2>Tus próximas citas</h2>' + d.proximas.map(function (c) {
        return '<div class="cita"><div class="cuando">' + esc(fechaAmigable(c.fecha)) + ' · ' + esc(hora12(c.hora)) + '</div>' +
          '<div class="detalle">Con ' + esc(c.consejero) + ' · ' + c.duracion + ' min</div><div class="detalle">' + lugarDe(c) + '</div>' +
          '<div class="acciones">' + (c.enlace ? '<a class="boton-chico primario" href="' + esc(c.enlace) + '" target="_blank" rel="noopener">Unirse a la videollamada</a>' : '') +
          '<button class="boton-chico peligro" data-cancelar="' + esc(c.id) + '">Cancelar cita</button></div></div>';
      }).join('');
    } else {
      html += '<h2>¿Necesitas conversar?</h2><p class="suave">Agenda una consejería presencial o virtual con un consejero de la iglesia. Es confidencial.</p>';
    }
    if (d.hayConsejeros) html += '<button class="boton" id="agendar">Agendar una consejería</button>';
    if (d.anteriores.length) {
      html += '<p class="paso" style="margin-top:18px">Anteriores</p>' + d.anteriores.map(function (c) {
        return '<div class="dato"><span>' + esc(fechaCorta(c.fecha)) + ' · ' + esc(c.consejero) + '</span><span class="estado ' + esc(c.estado) + '">' + esc(ESTADO[c.estado] || c.estado) + '</span></div>';
      }).join('');
    }
    html += '</div>';
    if (d.esConsejero) {
      html += '<div class="tarjeta"><div class="paso">Soy consejero(a)</div><p>' +
        (d.agendaHoy ? 'Tienes <b>' + d.agendaHoy + '</b> cita(s) por atender.' : 'No tienes citas pendientes.') + '</p>' +
        '<button class="boton secundario" id="miAgenda">Abrir mi agenda y mis horarios</button></div>';
    }
    return {
      html: html,
      conectar: function () {
        on('#agendar', 'click', function () { App.ir('agendar'); });
        on('#miAgenda', 'click', function () { App.ir('agenda'); });
        cadaUno('[data-cancelar]', 'click', function (b) {
          if (!confirm('¿Cancelar esta cita? Le avisaremos a tu consejero.')) return;
          b.disabled = true;
          llamar('consejeria.cancelar', { id: b.getAttribute('data-cancelar') }).then(function () {
            toast('Cita cancelada'); op.recargar();
          }, function (err) { toast(err.message); b.disabled = false; });
        });
      }
    };
  });

  // ================================================================
  //  Agendar (paso 1: con quién y cómo · paso 2: cuándo · paso 3: confirmar)
  // ================================================================
  function pasoConsejero() {
    cargando();
    llamar('consejeria.opciones', {}).then(function (r) {
      C.opciones = r;
      if (r.activas >= r.maxActivas) {
        app.innerHTML = cabecera('Consejería') + '<div class="tarjeta centro"><h1>Ya tienes citas pendientes</h1><p class="suave">Puedes tener hasta ' +
          r.maxActivas + ' citas a la vez. Cancela una desde Mi espacio para agendar otra.</p><button class="boton" id="volver">Ir a Mi espacio</button></div>';
        return on('#volver', 'click', function () { App.ir('mi'); });
      }
      if (!r.consejeros.length) {
        app.innerHTML = cabecera('Consejería') + '<div class="tarjeta centro"><h1>Sin horarios por ahora</h1><p class="suave">Aún no hay consejeros con horarios disponibles.</p><button class="boton" id="volver">Volver</button></div>';
        return on('#volver', 'click', function () { App.ir('mi'); });
      }
      var mods = {};
      r.consejeros.forEach(function (c) { c.modalidades.forEach(function (m) { mods[m] = true; }); });
      var opcionesMod = Object.keys(mods);
      if (C.modalidad && !mods[C.modalidad]) C.modalidad = '';
      app.innerHTML = cabecera('Agendar consejería') + '<div class="tarjeta"><div class="paso">Paso 1 de 3</div><h1>¿Con quién?</h1>' +
        '<ul class="resultados"><li><button class="opcion" data-c=""><span>Cualquier consejero disponible<br><small>Te mostramos todos los horarios</small></span></button></li>' +
        r.consejeros.map(function (c) {
          return '<li><button class="opcion" data-c="' + esc(c.id) + '"><span>' + esc(c.nombre) + '<br><small>' +
            c.modalidades.map(function (m) { return MODALIDAD[m]; }).join(' o ') + '</small></span></button></li>';
        }).join('') + '</ul>' +
        (opcionesMod.length > 1 ? '<label class="campo">¿Cómo prefieres?</label><div class="seleccion" id="mods">' +
          [['', 'Me da igual']].concat(opcionesMod.map(function (m) { return [m, MODALIDAD[m]]; })).map(function (o) {
            return '<button data-m="' + o[0] + '" class="' + (C.modalidad === o[0] ? 'activa' : '') + '">' + esc(o[1]) + '</button>';
          }).join('') + '</div>' : '') +
        '<button class="enlace" id="volver">Volver</button></div>';
      cadaUno('#mods button', 'click', function (b) {
        C.modalidad = b.getAttribute('data-m');
        $$('#mods button').forEach(function (x) { x.classList.toggle('activa', x === b); });
      });
      cadaUno('[data-c]', 'click', function (b) { C.consejero = b.getAttribute('data-c'); pasoHorario(); });
      on('#volver', 'click', function () { App.ir('mi'); });
    }, function (err) {
      if (err.codigo === 'permiso') return App.ir('mi');
      mostrarError(err, pasoConsejero, 'Consejería');
    });
  }

  function pasoHorario() {
    cargando('Buscando horarios…');
    llamar('consejeria.horarios', { consejero: C.consejero, modalidad: C.modalidad }).then(function (r) {
      C.horarios = r.horarios;
      var fechas = [];
      r.horarios.forEach(function (h) { if (fechas.indexOf(h.fecha) < 0) fechas.push(h.fecha); });
      if (fechas.indexOf(C.fecha) < 0) C.fecha = fechas[0] || '';
      var html = cabecera('Agendar consejería') + '<div class="tarjeta"><div class="paso">Paso 2 de 3</div><h1>¿Cuándo?</h1>';
      if (!fechas.length) {
        html += '<p class="suave">No hay horarios libres en las próximas semanas con esa opción. Prueba con otro consejero o modalidad.</p>';
      } else {
        html += '<div class="seleccion fechas" id="fechas">' + fechas.map(function (f) {
          var p = f.split('-');
          return '<button data-f="' + f + '" class="' + (f === C.fecha ? 'activa' : '') + '"><small>' + esc(diaSemana(f).slice(0, 3)) + '</small>' +
            Number(p[2]) + '<small>' + esc(MESES[Number(p[1]) - 1].slice(0, 3)) + '</small></button>';
        }).join('') + '</div><h2 style="margin-top:18px" id="tituloFecha"></h2><div class="seleccion" id="horas"></div>';
      }
      html += '<button class="enlace" id="volver">Cambiar consejero o modalidad</button></div>';
      app.innerHTML = html;
      function pintarHoras() {
        if (!C.fecha) return;
        $('#tituloFecha').textContent = fechaAmigable(C.fecha);
        var delDia = C.horarios.filter(function (h) { return h.fecha === C.fecha; });
        $('#horas').innerHTML = delDia.map(function (h, i) {
          return '<button data-i="' + i + '">' + esc(hora12(h.hora)) + (C.consejero ? '' : '<br><small class="suave">' + esc(primerNombre(h.consejero)) + '</small>') + '</button>';
        }).join('');
        cadaUno('#horas button', 'click', function (b) { C.elegido = delDia[Number(b.getAttribute('data-i'))]; pasoConfirmar(); });
      }
      cadaUno('#fechas button', 'click', function (b) {
        C.fecha = b.getAttribute('data-f');
        $$('#fechas button').forEach(function (x) { x.classList.toggle('activa', x === b); });
        pintarHoras();
      });
      on('#volver', 'click', pasoConsejero);
      pintarHoras();
    }, function (err) { mostrarError(err, pasoHorario, 'Consejería'); });
  }

  function pasoConfirmar() {
    var h = C.elegido;
    var mods = C.modalidad ? [C.modalidad] : h.modalidades;
    var modalidad = mods.length === 1 ? mods[0] : '';
    app.innerHTML = cabecera('Agendar consejería') + '<div class="tarjeta"><div class="paso">Paso 3 de 3</div><h1>Confirma tu cita</h1>' +
      '<div class="cita"><div class="cuando">' + esc(fechaAmigable(h.fecha)) + ' · ' + esc(hora12(h.hora)) + '</div>' +
      '<div class="detalle">Con ' + esc(h.consejero) + ' · ' + h.duracion + ' min</div></div>' +
      (mods.length > 1 ? '<label class="campo">¿Presencial o virtual?</label><div class="seleccion" id="modsC">' + mods.map(function (m) {
        return '<button data-m="' + m + '">' + MODALIDAD[m] + '</button>';
      }).join('') + '</div>' : '<p class="detalle" style="margin-top:12px">' + lugarDe({ modalidad: modalidad, lugar: h.lugar }) + '</p>') +
      '<label class="campo" for="motivo">¿De qué te gustaría hablar? <span class="suave pequeno">(opcional, solo lo verá tu consejero)</span></label>' +
      '<textarea id="motivo" maxlength="500"></textarea>' +
      '<button class="boton" id="confirmar">Confirmar cita</button><button class="enlace" id="volver">Elegir otro horario</button></div>';
    var boton = $('#confirmar');
    boton.disabled = !modalidad;
    cadaUno('#modsC button', 'click', function (b) {
      modalidad = b.getAttribute('data-m');
      $$('#modsC button').forEach(function (x) { x.classList.toggle('activa', x === b); });
      boton.disabled = false;
    });
    on('#volver', 'click', pasoHorario);
    boton.addEventListener('click', function () {
      boton.disabled = true;
      llamar('consejeria.agendar', { consejero: h.consejero_id, fecha: h.fecha, hora: h.hora, modalidad: modalidad, motivo: $('#motivo').value })
        .then(function (r) { citaLista(r.cita); }, function (err) {
          toast(err.message);
          if (err.codigo === 'ocupado') pasoHorario(); else boton.disabled = false;
        });
    });
  }

  function citaLista(c) {
    app.innerHTML = cabecera('Consejería') + '<div class="tarjeta centro"><div class="exito-icono">' + icono('calendario', 48) + '</div>' +
      '<h1>¡Cita agendada!</h1><div class="cita" style="text-align:left"><div class="cuando">' + esc(fechaAmigable(c.fecha)) + ' · ' + esc(hora12(c.hora)) + '</div>' +
      '<div class="detalle">Con ' + esc(c.consejero) + ' · ' + c.duracion + ' min</div><div class="detalle">' + lugarDe(c) + '</div>' +
      (c.enlace ? '<div class="acciones"><a class="boton-chico primario" href="' + esc(c.enlace) + '" target="_blank" rel="noopener">Enlace de la videollamada</a></div>' : '') +
      '</div><p class="suave pequeno" style="margin-top:12px">La verás siempre en Mi espacio. Si dejaste tu correo, te llegará un aviso.</p>' +
      '<button class="boton" id="volver">Ir a Mi espacio</button></div>';
    on('#volver', 'click', function () { App.ir('mi'); });
  }

  // ================================================================
  //  Agenda del consejero
  // ================================================================
  function cargarAgenda() {
    if (!App.codigo) return App.ir('mi');
    cargando();
    llamar('consejeria.agenda', {}).then(pintarAgenda, function (err) {
      if (err.codigo === 'permiso') { toast(err.message); return App.ir('mi'); }
      mostrarError(err, cargarAgenda, 'Mi agenda');
    });
  }

  function tarjetaCita(c, futura) {
    var contacto = [c.telefono ? '<a class="boton-chico" target="_blank" rel="noopener" href="' + esc(enlaceWhatsApp(c.telefono, 'Hola ' + primerNombre(c.persona) + ', ')) + '">WhatsApp</a>' : '',
      c.correo ? '<a class="boton-chico" href="mailto:' + esc(c.correo) + '">Correo</a>' : '', c.enlace ? '<a class="boton-chico" target="_blank" rel="noopener" href="' + esc(c.enlace) + '">Videollamada</a>' : ''].join('');
    return '<div class="cita" data-id="' + esc(c.id) + '"><div class="fila"><div class="cuando">' + esc(futura ? hora12(c.hora) : fechaCorta(c.fecha) + ' · ' + hora12(c.hora)) +
      ' · ' + esc(c.persona) + '</div><span class="estado ' + esc(c.estado) + '">' + esc(ESTADO[c.estado]) + '</span></div>' +
      '<div class="detalle">' + lugarDe(c) + ' · ' + c.duracion + ' min</div>' +
      (c.motivo ? '<p style="margin:8px 0 0"><b>Motivo:</b> ' + esc(c.motivo) + '</p>' : '') +
      '<div class="acciones">' + contacto + '</div>' +
      '<label class="campo pequeno" for="n' + esc(c.id) + '">Notas privadas</label><textarea id="n' + esc(c.id) + '" data-notas="' + esc(c.id) + '" style="min-height:64px">' + esc(c.notas || '') + '</textarea>' +
      '<div class="acciones">' + (c.estado === 'agendada' ? '<button class="boton-chico primario" data-estado="realizada">Realizada</button>' +
        '<button class="boton-chico" data-estado="no_asistio">No asistió</button><button class="boton-chico peligro" data-estado="cancelada">Cancelar</button>' : '') +
      '<button class="boton-chico" data-guardar>Guardar notas</button></div></div>';
  }

  var DIAS_CORTOS = [['lunes', 'L'], ['martes', 'M'], ['miércoles', 'X'], ['jueves', 'J'], ['viernes', 'V'], ['sábado', 'S'], ['domingo', 'D']];

  function pintarAgenda(r) {
    var html = cabecera('Mi agenda') + '<button class="enlace" id="volverA" style="text-align:left;padding-left:0">← Mi espacio</button>';
    var porFecha = {};
    r.proximas.forEach(function (c) { (porFecha[c.fecha] = porFecha[c.fecha] || []).push(c); });
    html += '<div class="tarjeta"><h2>Próximas citas</h2>' + (r.proximas.length ? Object.keys(porFecha).map(function (f) {
      return '<p class="paso" style="margin-top:12px">' + esc(f === r.hoy ? 'Hoy' : fechaAmigable(f)) + '</p>' + porFecha[f].map(function (c) { return tarjetaCita(c, true); }).join('');
    }).join('') : '<p class="suave">No tienes citas agendadas.</p>') + '</div>';
    if (r.recientes.length) html += '<div class="tarjeta"><h2>Últimos 30 días</h2>' + r.recientes.map(function (c) { return tarjetaCita(c, false); }).join('') + '</div>';

    html += '<div class="tarjeta"><h2>Mis horarios</h2><p class="suave pequeno">Bloques semanales en los que atiendes. Las personas solo ven los espacios libres.</p>' +
      (r.bloques.length ? r.bloques.map(function (b) {
        return '<div class="dato"><span>' + esc(b.texto) + ', ' + esc(hora12(b.hora_inicio)) + '–' + esc(hora12(b.hora_fin)) + '<br><small class="suave">' +
          esc((MODALIDAD[b.modalidad] || 'Presencial o virtual') + ' · citas de ' + b.duracion + ' min' + (b.lugar ? ' · ' + b.lugar : '')) + '</small></span>' +
          '<button class="boton-chico peligro" data-quitar-bloque="' + esc(b.id) + '">Quitar</button></div>';
      }).join('') : '<p class="aviso alerta">Aún no tienes horarios: nadie puede agendar contigo.</p>') +
      '<form id="formBloque"><label class="campo">Días</label><div class="seleccion" id="diasB">' + DIAS_CORTOS.map(function (d) {
        return '<button type="button" data-dia="' + d[0] + '" aria-label="' + d[0] + '">' + d[1] + '</button>';
      }).join('') + '</div><div class="grilla-2"><div><label class="campo" for="hIni">Desde</label><input type="time" id="hIni" value="18:00"></div>' +
      '<div><label class="campo" for="hFin">Hasta</label><input type="time" id="hFin" value="20:00"></div></div>' +
      '<div class="grilla-2"><div><label class="campo" for="dur">Cada cita dura</label><select id="dur"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">1 hora</option></select></div>' +
      '<div><label class="campo" for="mod">Modalidad</label><select id="mod"><option value="ambas">Presencial o virtual</option><option value="presencial">Solo presencial</option><option value="virtual">Solo virtual</option></select></div></div>' +
      '<label class="campo" for="lugar">Lugar (presencial)</label><input type="text" id="lugar" placeholder="Ej.: Oficina pastoral">' +
      '<label class="campo" for="enlace">Enlace de videollamada (virtual)</label><input type="text" id="enlace" placeholder="https://meet.google.com/…">' +
      '<button class="boton secundario" type="submit">+ Agregar horario</button></form></div>';

    html += '<div class="tarjeta"><h2>No estaré disponible</h2>' +
      (r.ausencias.length ? r.ausencias.map(function (a) {
        return '<div class="dato"><span>' + esc(fechaCorta(a.desde)) + (a.hasta !== a.desde ? ' al ' + esc(fechaCorta(a.hasta)) : '') + (a.motivo ? ' · ' + esc(a.motivo) : '') + '</span>' +
          '<button class="boton-chico peligro" data-quitar-ausencia="' + esc(a.id) + '">Quitar</button></div>';
      }).join('') : '') +
      '<form id="formAusencia"><div class="grilla-2"><div><label class="campo" for="aDesde">Desde</label><input type="date" id="aDesde" min="' + esc(r.hoy) + '" required></div>' +
      '<div><label class="campo" for="aHasta">Hasta</label><input type="date" id="aHasta" min="' + esc(r.hoy) + '"></div></div>' +
      '<label class="campo" for="aMotivo">Motivo <span class="suave pequeno">(opcional)</span></label><input type="text" id="aMotivo">' +
      '<button class="boton secundario" type="submit">Guardar</button></form></div>';
    app.innerHTML = html;

    on('#volverA', 'click', function () { App.ir('mi'); });
    cadaUno('[data-estado]', 'click', function (b) {
      var id = b.closest('.cita').getAttribute('data-id'), estado = b.getAttribute('data-estado');
      if (estado === 'cancelada' && !confirm('¿Cancelar la cita? Se le avisará a la persona si dejó su correo.')) return;
      guardarCita(id, { estado: estado, notas: $('[data-notas="' + id + '"]').value });
    });
    cadaUno('[data-guardar]', 'click', function (b) {
      var id = b.closest('.cita').getAttribute('data-id');
      guardarCita(id, { notas: $('[data-notas="' + id + '"]').value });
    });
    cadaUno('#diasB button', 'click', function (b) { b.classList.toggle('activa'); });
    $('#formBloque').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var dias = $$('#diasB button.activa').map(function (b) { return b.getAttribute('data-dia'); });
      llamar('consejeria.guardarBloque', { dias: dias, hora_inicio: $('#hIni').value, hora_fin: $('#hFin').value,
        duracion: Number($('#dur').value), modalidad: $('#mod').value, lugar: $('#lugar').value, enlace: $('#enlace').value })
        .then(function () { toast('Horario agregado'); cargarAgenda(); }, function (err) { toast(err.message); });
    });
    cadaUno('[data-quitar-bloque]', 'click', function (b) {
      if (!confirm('¿Quitar este horario? Las citas ya agendadas se mantienen.')) return;
      llamar('consejeria.quitarBloque', { id: b.getAttribute('data-quitar-bloque') }).then(cargarAgenda, function (err) { toast(err.message); });
    });
    $('#formAusencia').addEventListener('submit', function (ev) {
      ev.preventDefault();
      llamar('consejeria.guardarAusencia', { desde: $('#aDesde').value, hasta: $('#aHasta').value, motivo: $('#aMotivo').value })
        .then(function (x) {
          toast(x.citasEnEsasFechas ? 'Guardado. Ojo: tienes ' + x.citasEnEsasFechas + ' cita(s) en esas fechas.' : 'Guardado');
          cargarAgenda();
        }, function (err) { toast(err.message); });
    });
    cadaUno('[data-quitar-ausencia]', 'click', function (b) {
      llamar('consejeria.quitarAusencia', { id: b.getAttribute('data-quitar-ausencia') }).then(cargarAgenda, function (err) { toast(err.message); });
    });
  }

  function guardarCita(id, cambios) {
    cambios.id = id;
    llamar('consejeria.actualizar', cambios).then(function () { toast('Guardado'); cargarAgenda(); }, function (err) { toast(err.message); });
  }

  // ================================================================
  //  Servidores: panel de consejería (admin, sin datos confidenciales)
  // ================================================================
  App.pestanaServidor({ id: 'consejeria', nombre: 'Consejería', rol: 'admin', modulo: 'consejeria', ancho: true, abrir: function (zona) {
    cargando('Cargando…', zona);
    llamar('consejeria.panel', {}).then(function (r) {
      var e = r.porEstado;
      zona.innerHTML = '<div class="kpis">' + [[r.proximos7, 'Citas en los próximos 7 días'], [e.agendada, 'Agendadas'], [e.realizada, 'Realizadas'],
        [e.cancelada + e.no_asistio, 'Canceladas o no asistió'], [r.horariosLibres, 'Horarios libres (próximas semanas)']].map(function (k) {
        return '<div class="kpi"><div class="valor">' + esc(k[0]) + '</div><div class="nombre">' + esc(k[1]) + '</div></div>';
      }).join('') + '</div>' +
        '<div class="tarjeta"><h2>Consejeros</h2>' + (r.consejeros.length ? '<div class="tabla-envoltura"><table><thead><tr><th>Nombre</th><th class="num">Horarios</th><th class="num">Próximas</th><th class="num">Realizadas</th></tr></thead><tbody>' +
          r.consejeros.map(function (c) {
            return '<tr class="clic" data-id="' + esc(c.id) + '"><td>' + esc(c.nombre) + (c.bloques ? '' : ' <span class="pastilla">sin horarios</span>') + '</td><td class="num">' + c.bloques +
              '</td><td class="num">' + c.proximas + '</td><td class="num">' + c.realizadas + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<p class="suave">No hay consejeros.</p>') +
        '<p class="suave pequeno" style="margin-top:12px">Para que alguien sea consejero escribe <b>consejero</b> en su columna <b>roles</b> (hoja Personas) y envíale su enlace personal: ' +
        'desde su Mi espacio define sus horarios. Los motivos y notas de las citas son confidenciales y no se muestran aquí.</p></div>';
      cadaUno('tr.clic', 'click', function (tr) { App.ir('ficha/' + tr.getAttribute('data-id')); });
    }, errorServidor);
  } });
})();
</script>

  <script>
/* SERVIDORES: acceso con PIN (o con el código personal de un líder) y pestañas que aportan los módulos. */
(function () {
  App.vista('servidores', function (pestana) {
    var roles = rolesServidor();
    if (!roles.length) return vistaAcceso(pestana);
    // Las pestañas dependen de los módulos activos: si aún no se conocen, se piden primero.
    if (!App.info.modulos.length) {
      cargando();
      return llamar('personas.info', {}).then(function () { abrir(pestana, roles); }, function (err) { mostrarError(err, App.mostrar, 'Servidores'); });
    }
    abrir(pestana, roles);
  });

  /** Roles para herramientas: los del PIN de esta sesión + los del código personal. */
  function rolesServidor() {
    var r = (leerSesion('rolesPin') || '').split(',').filter(Boolean);
    App.roles.forEach(function (x) { if ((x === 'ayudante' || x === 'admin') && r.indexOf(x) < 0) r.push(x); });
    return r;
  }

  function vistaAcceso(pestana) {
    app.innerHTML = cabecera('Servidores') + '<div class="tarjeta"><h1>Acceso para servidores</h1>' +
      '<form id="formPin"><label class="campo" for="pin">PIN</label>' +
      '<input type="password" id="pin" inputmode="numeric" autocomplete="off" required>' +
      '<label class="campo" for="nomAy">Tu nombre <span class="suave pequeno">(queda anotado al marcar)</span></label>' +
      '<input type="text" id="nomAy" value="' + esc(App.ayudante) + '" autocapitalize="words">' +
      '<button class="boton" type="submit">Entrar</button></form>' +
      '<p class="suave pequeno" style="margin-top:14px">Si eres líder con rol de administrador, también puedes entrar desde tu Mi espacio.</p>' +
      '<button class="enlace" id="volver">Volver</button></div>';
    on('#volver', 'click', function () { App.ir('marcar'); });
    $('#formPin').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pin = $('#pin').value.trim();
      App.ayudante = $('#nomAy').value.trim();
      guardar('ayudante', App.ayudante);
      llamar('personas.entrar', { pin: pin, codigo: '' }).then(function (r) {
        App.pin = pin;
        guardarSesion('pin', pin);
        guardarSesion('rolesPin', r.roles.join(','));
        abrir(pestana, rolesServidor());
      }, function (err) { toast(err.message); });
    });
    enfocar('#pin');
  }

  function abrir(pestana, roles) {
    var disponibles = App.pestanas.filter(function (p) {
      return roles.indexOf(p.rol) >= 0 && (!p.modulo || App.activo(p.modulo));
    });
    if (!disponibles.length) return vistaAcceso();
    var actual = disponibles.filter(function (p) { return p.id === pestana; })[0] || disponibles[0];
    if (actual.id !== pestana) { history.replaceState(null, '', '#/servidores/' + actual.id); }
    app.className = 'contenedor' + (actual.ancho ? ' ancho' : '');
    app.innerHTML = cabecera('Servidores') +
      '<div class="pestanas">' + disponibles.map(function (p) {
        return '<button data-p="' + esc(p.id) + '" class="' + (p.id === actual.id ? 'activa' : '') + '">' + esc(p.nombre) + '</button>';
      }).join('') + '<button data-p="salir">Salir</button></div><div id="contenidoServidor"></div>';
    cadaUno('.pestanas button', 'click', function (b) {
      var id = b.getAttribute('data-p');
      if (id === 'salir') return salirServidor();
      App.ir('servidores/' + id);
    });
    actual.abrir($('#contenidoServidor'));
  }

  window.salirServidor = function () {
    App.pin = '';
    guardarSesion('pin', ''); guardarSesion('rolesPin', '');
    App.ir(App.codigo ? 'mi' : 'marcar');
  };

  window.errorServidor = function (err) {
    toast(err.message);
    if (err.codigo === 'permiso' || err.codigo === 'bloqueado') {
      App.pin = '';
      // Si a un líder le quitaron el rol, se olvida para no volver a intentarlo.
      App.guardarCodigo(App.codigo, App.yo, App.roles.filter(function (r) { return r === 'persona' || r === 'consejero'; }));
      guardarSesion('pin', ''); guardarSesion('rolesPin', '');
      setTimeout(function () { App.ir('servidores'); }, 50);
    }
  };
})();
</script>

  <script>App.iniciar();</script>
</body>
